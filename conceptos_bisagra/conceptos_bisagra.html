<style>

  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;margin:0}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}

svg#world{width:100%;height:100%;display:block}

.n{transition:opacity .6s}

.cnum{font-family:var(--display);font-weight:800;font-size:26px}
.ckw{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.06em;fill:var(--ink)}
.csub{font-size:13px;fill:var(--muted);font-style:italic}
.colhead{font-family:var(--mono);font-size:13px;letter-spacing:.2em}
.coltitle{font-family:var(--display);font-weight:800;font-size:34px;fill:var(--ink)}
/* líneas */
.e{fill:none;stroke-width:2;transition:opacity .6s,stroke-width .5s,stroke .5s}
.e.a{stroke-dasharray:7 7}
.e.p{stroke:var(--paso)} .e.t{stroke:var(--trad)}
#world.focus .e{opacity:.06}
#world.focus .n{opacity:.22}
#world.focus .e.on{opacity:.55;stroke-width:3}
#world.focus .n.on{opacity:.9}
#world.focus .e.go{opacity:1;stroke-width:3.5}
#world.focus .n.act{opacity:1}
.n.act rect.bx{stroke-width:5!important;stroke-opacity:1!important}
.n.act.pp rect.bx{stroke:var(--paso-hi)!important;fill:color-mix(in srgb,var(--paso) 22%,var(--bg))!important}
.n.act.tt rect.bx{stroke:var(--trad-hi)!important;fill:color-mix(in srgb,var(--trad) 22%,var(--bg))!important}
.n.act .kw{fill:#fff}
.n.src rect.box{stroke-width:4;stroke-opacity:1}
.ring{fill:none;stroke-width:3;opacity:0}
.n.act .ring{animation:ring 1.8s ease-out .9s infinite}
@keyframes ring{0%{opacity:.9;stroke-width:4}100%{opacity:0;stroke-width:22}}
#fx path.glow{fill:none;stroke-width:16;opacity:.18;stroke-linecap:round}
#fx path.core{fill:none;stroke-width:6;stroke-linecap:round}
#fx path.flow{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:2 22;stroke-linecap:round;opacity:.9;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
#fx .call rect{fill:var(--raise);stroke-width:1.5}
#fx .call .ck{font-family:var(--mono);font-size:12px;letter-spacing:.12em}
#fx .call .cq{font-family:var(--display);font-size:18px;fill:var(--ink)}
.cn{cursor:pointer}
.cn:hover rect.box{stroke:var(--serv)}

.quote{font-family:var(--display);font-size:19px;line-height:1.4;margin:.4em 0;color:var(--ink)}
.qsrc{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.kindbadge{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:6px 10px;border:1px solid var(--line);border-radius:4px;color:var(--soft);margin-top:.6em}

.links{list-style:none;padding:0;margin:0;display:grid;gap:8px}

.next{margin-top:1.4em;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}

#nav{position:fixed;z-index:7;right:0;bottom:0;width:min(460px,40vw);display:flex;align-items:center;gap:8px;

  background:var(--panel);border-top:1px solid var(--line);border-left:1px solid var(--line)}
#nav button{font:500 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:9px 13px;cursor:pointer}

button:focus-visible,.cn:focus-visible{outline:2px solid var(--serv);outline-offset:2px}
#nav .count{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
#dots{display:flex;justify-content:center;gap:5px;margin-top:5px}
#dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
#dots span.on{background:var(--serv)}

#prog{position:fixed;z-index:8;left:0;top:0;height:3px;background:var(--serv);transition:width .6s}

#toc{position:fixed;z-index:9;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(460px,40vw);max-height:70%;overflow-y:auto;

  #panel{left:0;right:0;top:auto;width:auto;height:50%;border-left:0;border-top:1px solid var(--line);

  #nav,#toc{left:0;width:auto;border-left:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- ajuste de texto dentro de los recuadros ---------- */
function fitAll(){
  document.querySelectorAll('text[data-fit]').forEach(t=>{
    const max=+t.dataset.fit,min=+t.dataset.min;
    if(!t.dataset.orig){t.dataset.orig=t.textContent;t.dataset.y=t.getAttribute('y');t.dataset.fs=parseFloat(getComputedStyle(t).fontSize)}
    t.textContent=t.dataset.orig;t.setAttribute('y',t.dataset.y);t.style.fontSize='';
    let fs=+t.dataset.fs,w=t.getComputedTextLength();
    if(w<=max)return;
    fs=fs*max/w;
    if(fs>=min){t.style.fontSize=fs+'px';return}
    // dos líneas: corta en « · » si existe, si no en el espacio más cercano al centro
    const s=t.dataset.orig;let cut=s.indexOf(' · ');let a,b;
    if(cut>0){a=s.slice(0,cut);b=s.slice(cut+3)}
    else{const mid=s.length/2;let best=-1;for(let i=0;i<s.length;i++)if(s[i]===' '&&(best<0||Math.abs(i-mid)<Math.abs(best-mid)))best=i;a=s.slice(0,best);b=s.slice(best+1)}
    const x=t.getAttribute('x'),y0=+t.dataset.y;t.textContent='';
    const lh=fs<min?min*1.15:fs*1.15;let f=Math.max(min,Math.min(+t.dataset.fs,+t.dataset.fs*max/Math.max(1,
      (()=>{const p=el('tspan',{},t);p.textContent=a.length>b.length?a:b;const L=t.getComputedTextLength();t.textContent='';return L})())));
    t.style.fontSize=f+'px';
    const l1=el('tspan',{x,y:y0-f*0.45},t);l1.textContent=a;
    const l2=el('tspan',{x,y:y0-f*0.45+f*1.15},t);l2.textContent=b;
  });
}
fitAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);

/* ---------- índice ---------- */
const toc=document.getElementById('toc');
toc.innerHTML=`<h2>ÍNDICE</h2><ol>
 <li><button data-go="inicio"><span class="r">·</span><span>Portada</span><span class="c"></span></button></li>
 ${C.map((c,i)=>`<li><button data-go="c${i+1}"><span class="r">${ROM[i]}</span><span>${c.kw[0]+c.kw.slice(1).toLowerCase()}</span><span class="c">${c.L.length} vínc.</span></button></li>`).join('')}

const tocb=document.getElementById('tocb');
function showToc(v){toc.hidden=!v;tocb.setAttribute('aria-expanded',v)}
tocb.onclick=()=>showToc(toc.hidden);

/* ---------- cámara ---------- */
const cam=document.getElementById('cam'),world=document.getElementById('world'),stage=document.getElementById('stage');
let view={x:0,y:0,s:1},anim=null,onArrive=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function area(){const W=innerWidth,H=innerHeight;
  if(W>860){const pw=Math.min(460,W*.4);return{x:0,y:0,w:W-pw,h:H}}
  return{x:0,y:0,w:W,h:H*.5}}
function fit(r){const a=area();const s=Math.min(2.2,Math.min(a.w/r.w,a.h/r.h)*.94);
  return{s,x:a.x+a.w/2-(r.x+r.w/2)*s,y:a.y+a.h/2-(r.y+r.h/2)*s}}
function apply(v){view=v;cam.setAttribute('transform',`translate(${v.x},${v.y}) scale(${v.s})`)}
function center(v){const a=area();return{cx:(a.x+a.w/2-v.x)/v.s,cy:(a.y+a.h/2-v.y)/v.s}}
function fly(to,done){
  cancelAnimationFrame(anim);
  if(reduce){apply(to);done&&done();return}
  const a=area(),c0=center(view),c1=center(to),s0=view.s,s1=to.s;
  const dist=Math.hypot(c1.cx-c0.cx,c1.cy-c0.cy);
  const span=Math.max(a.w/Math.min(s0,s1),a.h/Math.min(s0,s1));
  const bump=Math.min(.5,dist/(span*1.4));
  const dur=1150+Math.min(600,dist*.4),t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  (function f(now){let t=Math.min(1,(now-t0)/dur),e=ease(t);
    let s=Math.exp(Math.log(s0)+(Math.log(s1)-Math.log(s0))*e)*(1-bump*Math.sin(Math.PI*e));
    const cx=c0.cx+(c1.cx-c0.cx)*e,cy=c0.cy+(c1.cy-c0.cy)*e;
    apply({s,x:a.x+a.w/2-cx*s,y:a.y+a.h/2-cy*s});
    if(t<1)anim=requestAnimationFrame(f);else done&&done()})(t0);
}

/* ---------- efecto de vínculo: la línea se dibuja, fluye y aparece el rótulo ---------- */
let dotRAF=null;
function clearFx(){$fx.innerHTML='';cancelAnimationFrame(dotRAF)}
function drawLink(st){
  clearFx();
  const [to,k,q,s]=C[st.c].L[st.j];const isP=to[0]==='P';const col=isP?'var(--paso-hi)':'var(--trad-hi)';
  const base=EDGE[st.c+'-'+st.j],d=base.getAttribute('d');
  const glow=el('path',{d,class:'glow',stroke:col},$fx);
  const core=el('path',{d,class:'core',stroke:col},$fx);
  const L=core.getTotalLength();
  if(k==='a'){core.setAttribute('stroke-dasharray','14 10')}
  // se dibuja desde el Concepto hacia el destino
  const mask=el('path',{d,fill:'none',stroke:'var(--bg)','stroke-width':22,'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':0},$fx);
  const flow=el('path',{d,class:'flow'},$fx);flow.style.opacity=0;
  const dot=el('circle',{r:9,fill:col},$fx);
  // rótulo en el punto medio
  const mid=core.getPointAtLength(L*.5);
  const g=el('g',{class:'call',opacity:0},$fx);
  const r=el('rect',{rx:6,stroke:col},g);
  const t1=el('text',{class:'ck',fill:col},g);t1.textContent=(k==='t'?'TEXTUAL':'ANALÍTICO')+'  ·  '+s.toUpperCase();
  const short=q.length>48?q.slice(0,46).replace(/\s+\S*$/,'')+'…':q;
  const t2=el('text',{class:'cq'},g);t2.textContent=short;
  const w=Math.max(t1.getComputedTextLength(),t2.getComputedTextLength())+32;
  const bx=mid.x-w/2,by=mid.y-78;
  r.setAttribute('x',bx);r.setAttribute('y',by);r.setAttribute('width',w);r.setAttribute('height',62);
  t1.setAttribute('x',bx+16);t1.setAttribute('y',by+22);t2.setAttribute('x',bx+16);t2.setAttribute('y',by+48);
  if(reduce){mask.remove();flow.style.opacity=.9;g.setAttribute('opacity',1);dot.remove();return}
  const t0=performance.now(),D=900;
  (function f(now){const t=Math.min(1,(now-t0)/D),e=1-Math.pow(1-t,3);
    mask.setAttribute('stroke-dashoffset',-L*e);
    const p=core.getPointAtLength(L*e);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
    g.setAttribute('opacity',Math.max(0,(t-.4)/.6));
    if(t<1)dotRAF=requestAnimationFrame(f);
    else{mask.remove();flow.style.transition='opacity .4s';flow.style.opacity=.9;
      // pulso viajero continuo
      const t1s=performance.now();(function loop(n){const u=((n-t1s)/1800)%1;const pp=core.getPointAtLength(L*u);dot.setAttribute('cx',pp.x);dot.setAttribute('cy',pp.y);dot.setAttribute('opacity',Math.sin(Math.PI*u));dotRAF=requestAnimationFrame(loop)})(t1s)}
  })(t0);
}

/* ---------- estado ---------- */
let cur=0;
const panel=document.getElementById('panel');
function highlight(st){
  const focus=st.c!==undefined||!!st.t2;
  world.classList.toggle('focus',focus);
  document.querySelectorAll('.on,.go,.act,.src').forEach(x=>x.classList.remove('on','go','act','src'));
  document.querySelectorAll('.hd').forEach(x=>x.classList.add('on'));
  if(st.c!==undefined){
    const cn=document.getElementById('n-c'+st.c);cn.classList.add('on','src');
    document.querySelectorAll(`.e[data-c="${st.c}"]`).forEach(e=>{e.classList.add(st.j===undefined?'go':'on');document.getElementById('n-'+e.dataset.to).classList.add('on')});
    if(st.j!==undefined){const to=C[st.c].L[st.j][0];document.getElementById('n-'+to).classList.add('act')}
  }
  if(st.t2){document.getElementById('n-T2').classList.add('act');
    document.querySelectorAll('.e[data-to="T2"]').forEach(e=>{e.classList.add('go');document.getElementById('n-c'+e.dataset.c).classList.add('on')})}
}
function go(i,fromHash){
  cur=Math.max(0,Math.min(STEPS.length-1,i));const st=STEPS[cur];
  panel.innerHTML=st.html;panel.scrollTop=0;
  clearFx();highlight(st);
  fly(fit(st.rect),st.j!==undefined?()=>{if(STEPS[cur]===st)drawLink(st)}:null);
  const cnt=document.getElementById('count'),dots=document.getElementById('dots');
  if(st.group!==undefined){const c=C[st.group];
    cnt.textContent=`Concepto ${ROM[st.group]}`+(st.sub?` · vínculo ${st.sub}/${c.L.length}`:'');
    dots.innerHTML=Array.from({length:c.L.length+1},(_,k)=>`<span class="${k===st.sub?'on':k<st.sub?'done':''}"></span>`).join('');
  }else{cnt.textContent=(cur+1)+' / '+STEPS.length;dots.innerHTML=''}
  document.getElementById('prog').style.width=(cur/(STEPS.length-1)*100)+'%';
  if(!fromHash&&location.hash!=='#'+st.id)history.replaceState(null,'','#'+st.id);
}
function goId(id){const i=STEPS.findIndex(s=>s.id===id);if(i>=0)go(i)}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('home').onclick=()=>go(0);
addEventListener('keydown',e=>{
  if(e.target.closest('#toc'))return;
  if(['ArrowRight','PageDown'].includes(e.key)||(e.key===' '&&!e.target.closest('.cn,button'))){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='Escape'){showToc(false)}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(STEPS.length-1);
});
function fromHash(){const h=location.hash.slice(1);const i=STEPS.findIndex(s=>s.id===h);go(i<0?0:i,true)}
addEventListener('hashchange',fromHash);
addEventListener('resize',()=>{cancelAnimationFrame(anim);apply(fit(STEPS[cur].rect))});

// tocar una línea o un nodo de destino lleva al vínculo
$e.addEventListener('click',e=>{const p=e.target.closest('.e');if(!p)return;const c=+p.dataset.c,j=C[c].L.findIndex(l=>l[0]===p.dataset.to);goId(`c${c+1}-${j+1}`)});
$e.querySelectorAll('.e').forEach(p=>{p.style.cursor='pointer';p.style.pointerEvents='stroke'});

/* ---------- exploración libre ---------- */
const pts=new Map();let last=null,pinch=null,moved=0;
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(pts.size===1)last={x:e.clientX,y:e.clientY};
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s}}});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*d/pinch.d/view.s);moved=99;return}
  if(last){const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){if(!stage.classList.contains('dragging')){stage.classList.add('dragging');stage.setPointerCapture(e.pointerId)}
      cancelAnimationFrame(anim);apply({s:view.s,x:view.x+dx,y:view.y+dy})}
    last={x:e.clientX,y:e.clientY}}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){last=null;stage.classList.remove('dragging')}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('click',e=>{if(moved>6)e.stopPropagation()},true);
function zoomAt(px,py,k){const s=Math.max(.15,Math.min(6,view.s*k));k=s/view.s;
  cancelAnimationFrame(anim);apply({s,x:px-(px-view.x)*k,y:py-(py-view.y)*k})}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});

apply(fit(WORLD));
fromHash();
</script>
