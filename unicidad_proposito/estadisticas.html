<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Faro · Estadísticas</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1E1B4B;--suave:#5F5B82;--fondo:#FFF8EC;--carta:#fff;--borde:#F1E4CF;--violeta:#7C3AED;--pista:#F3ECFF}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Nunito",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2{font-family:"Baloo 2","Nunito",sans-serif;line-height:1.15;margin:0}
.cab{background:linear-gradient(165deg,#2A1670,#6D28D9 55%,#FF5E7E);color:#fff;padding:24px 16px}
.cab div,main{max-width:1000px;margin:0 auto}
.cab h1{font-size:clamp(28px,5vw,40px)}
main{padding:20px 16px 60px}
form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
input{flex:1 1 260px;font:inherit;padding:10px 12px;border:2px solid var(--borde);border-radius:12px;background:#fff;min-width:0}
input.clave{flex:0 1 160px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 18px;background:var(--violeta);color:#fff;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi,.caja{background:var(--carta);border:2px solid var(--borde);border-radius:18px;padding:16px}
.kpi b{display:block;font-family:"Baloo 2";font-size:34px;line-height:1}
.kpi span{color:var(--suave);font-size:14px;font-weight:700}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.caja h2{font-size:22px;margin-bottom:4px}
.caja p.sub{color:var(--suave);margin:0 0 12px;font-size:14px}
.fila{display:grid;grid-template-columns:minmax(0,9em) 1fr 3.6em;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.fila .et{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pista{height:14px;background:var(--pista);border-radius:7px;overflow:hidden}
.pista i{display:block;height:100%;border-radius:7px;background:var(--c,var(--violeta))}
.reto{margin-top:10px;font-weight:800;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--borde)}
th:not(:first-child),td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.dias{display:flex;align-items:flex-end;gap:2px;height:120px}
.dias i{flex:1;background:var(--violeta);border-radius:3px 3px 0 0;min-height:2px}
.msj{color:var(--suave)}
</style>
</head>
<body>
<header class="cab"><div><h1>📊 Estadísticas de El Faro</h1><p style="margin:4px 0 0;opacity:.9">Datos anónimos: avance de cada visitante y ciudad aproximada.</p></div></header>
<main>
  <form id="f">
    <input id="url" placeholder="URL de la aplicación web de Apps Script (https://script.google.com/macros/s/AKfycbyy_QFkS05Q8Ou5s6n0kgTTZylqxJ_S3Nb5oySNqr5MtV-fD0CsxD6uiezh8siSrIhU9Q/exec)" required>
    <input id="clave" class="clave" placeholder="Clave" type="password">
    <button>Ver datos</button>
  </form>
  <div id="out"><p class="msj">Pega la URL de la aplicación web para ver los datos.</p></div>
</main>
<script>
const RETOS = [["La luz del faro","#FF9F1C"],["Zapatero a tus zapatos","#14B8A6"],["La puerta abierta","#EC4899"],
               ["El camino de la historia","#22B573"],["¿Quién lo dijo?","#F43F5E"],["El equilibrio del faro","#6366F1"]];
const FASE = {aprende:"Aprende", juega:"Juega", reflexiona:"Reflexiona", completado:"Completó"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem = (k, v) => { try { if(v === undefined) return localStorage.getItem(k) || ""; localStorage.setItem(k, v); } catch(e){ return ""; } };

const barra = (et, pct, valor, c) => `<div class="fila"><span class="et" title="${esc(et)}">${esc(et)}</span><div class="pista"><i style="width:${pct}%;${c?`--c:${c}`:''}"></i></div><span class="v">${valor}</span></div>`;
const tabla = (titulo, filas) => `<table><thead><tr><th>${titulo}</th><th>Usuarios</th><th>Avance prom.</th></tr></thead><tbody>
  ${filas.length ? filas.slice(0,30).map(x => `<tr><td>${esc(x.lugar)}</td><td>${x.usuarios}</td><td>${x.avance}%</td></tr>`).join("") : '<tr><td colspan="3" class="msj">Sin datos todavía</td></tr>'}</tbody></table>`;

function pintar(r){
  const maxDia = Math.max(1, ...r.dias.map(d => d.visitas));
  $("#out").innerHTML = `
  <div class="kpis">
    <div class="kpi"><b>${r.usuarios}</b><span>Usuarios únicos</span></div>
    <div class="kpi"><b>${r.visitas}</b><span>Visitas</span></div>
    <div class="kpi"><b>${r.recurrentes}</b><span>Regresaron</span></div>
    <div class="kpi"><b>${r.avancePromedio}%</b><span>Avance promedio</span></div>
    <div class="kpi"><b>${r.terminaron}</b><span>Encendieron el faro (100%)</span></div>
  </div>
  <div class="rejilla">
    <section class="caja"><h2>¿Hasta dónde llegan?</h2><p class="sub">Porcentaje de usuarios que alcanzó cada paso (de 24).</p>
      ${RETOS.map(([t,c], i) => `<div class="reto">Reto ${i+1} · ${t}</div>` +
        r.embudo.filter(x => x.reto === i+1).map(x => barra(FASE[x.fase], x.porcentaje, x.porcentaje+"%", c)).join("")).join("")}
    </section>
    <div style="display:grid;gap:16px;align-content:start">
      <section class="caja"><h2>Retos completados</h2><p class="sub">Dónde se quedó cada usuario.</p>
        ${r.retos.map(x => barra(x.retos === 6 ? "Los 6 🗼" : x.retos === 0 ? "Ninguno" : `${x.retos} reto${x.retos>1?'s':''}`, x.porcentaje, x.porcentaje+"%")).join("")}
      </section>
      <section class="caja"><h2>Visitas por día</h2><p class="sub">Últimos ${r.dias.length} días con actividad.</p>
        <div class="dias">${r.dias.map(d => `<i style="height:${d.visitas/maxDia*100}%" title="${d.dia}: ${d.visitas} visitas, ${d.usuarios} usuarios"></i>`).join("")}</div>
      </section>
      <section class="caja"><h2>Países</h2>${tabla("País", r.paises)}</section>
    </div>
    <section class="caja"><h2>Colombia por departamento</h2>${tabla("Departamento", r.colombia)}</section>
    <section class="caja"><h2>Ciudades</h2><p class="sub">Aproximada según la red de conexión; puede marcar la ciudad del proveedor de internet.</p>${tabla("Ciudad", r.ciudades)}</section>
  </div>
  <p class="msj" style="margin-top:16px">Actualizado: ${new Date(r.actualizado).toLocaleString("es-CO")}</p>`;
}

async function cargar(){
  const url = $("#url").value.trim(), clave = $("#clave").value;
  mem("faro-estad-url", url);
  $("#out").innerHTML = '<p class="msj">Cargando…</p>';
  try{
    const r = await (await fetch(url + (clave ? (url.includes("?") ? "&" : "?") + "clave=" + encodeURIComponent(clave) : ""))).json();
    if(r.error) throw new Error(r.error);
    pintar(r);
  }catch(e){ $("#out").innerHTML = `<p class="msj">No se pudieron cargar los datos: ${esc(e.message)}</p>`; }
}
$("#f").onsubmit = e => { e.preventDefault(); cargar(); };
$("#url").value = new URLSearchParams(location.search).get("url") || mem("faro-estad-url");
if($("#url").value) cargar();
</script>
</body>
</html>
