<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Faro: Una Sola Misión</title>
<meta name="description" content="Juego de estudio en 6 retos para comprender la unicidad de propósito de Alcohólicos Anónimos, basado en la literatura de A.A.">
<meta name="theme-color" content="#7C3AED">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sol:#FFC93C; --naranja:#FF8C42; --coral:#FF5E7E; --violeta:#8B5CF6;
  --turquesa:#14C8B8; --verde:#2FCB7E; --azul:#3B82F6;
  --tinta:#1E1B4B; --suave:#5F5B82; --fondo:#FFF8EC; --carta:#FFFFFF; --borde:#F1E4CF;
  --ok:#16A34A; --okfondo:#DCFCE7; --mal:#E11D48; --malfondo:#FFE4E6;
  --radio:22px; --sombra:0 10px 30px -12px rgba(30,27,75,.25);
  --c:var(--violeta);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.55}
h1,h2,h3,.baloo{font-family:"Baloo 2","Nunito",sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--sol);outline-offset:3px}
img,svg{display:block;max-width:100%}

/* ---------- Encabezado ---------- */
.cielo{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(165deg,#2A1670 0%,#6D28D9 38%,#FF5E7E 74%,#FFC93C 100%);
  padding:22px 16px 70px}
.cielo .estrellas{position:absolute;inset:0;pointer-events:none}
.cielo .estrellas i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8;animation:titila 3s infinite ease-in-out}
@keyframes titila{50%{opacity:.15}}
.cab{position:relative;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.marca{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.cab h1{font-size:clamp(38px,7vw,68px);font-weight:800;margin:4px 0 6px;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.cab p.lema{font-size:clamp(17px,2.3vw,21px);max-width:560px;margin:0 0 16px;opacity:.95}
.faro-box{width:clamp(130px,22vw,220px)}
.marcador{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px}
.olas{position:absolute;left:0;right:0;bottom:-2px;height:60px}

/* ---------- Navegación ---------- */
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--borde)}
nav.tabs .in{max-width:1100px;margin:0 auto;display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;font-weight:800;font-size:16px;color:var(--suave);white-space:nowrap}
.tab[aria-current="page"]{background:var(--tinta);color:#fff}
.tab.sonido{margin-left:auto}

main{max-width:1100px;margin:0 auto;padding:22px 16px 80px}
.titulo-seccion{font-size:clamp(28px,4vw,38px);font-weight:800;margin:6px 0 6px}
.sub{color:var(--suave);margin:0 0 20px;font-size:18px}

/* ---------- Mapa de retos ---------- */
.progreso{background:var(--carta);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px;margin:-48px auto 26px;position:relative;z-index:2;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.progreso .barra{flex:1 1 220px;height:18px;background:#F3EADB;border-radius:99px;overflow:hidden}
.progreso .barra b{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sol),var(--naranja),var(--coral),var(--violeta),var(--azul),var(--turquesa),var(--verde));transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.progreso strong{font-family:"Baloo 2";font-size:22px}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.isla{position:relative;text-align:left;background:var(--carta);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden;
  border:3px solid transparent;transition:transform .2s, border-color .2s;display:flex;flex-direction:column}
.isla:not([disabled]):hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--c)}
.isla .banda{background:var(--c);color:#fff;padding:16px 18px 14px;display:flex;align-items:center;gap:14px;position:relative}
.isla .banda::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18)}
.isla .num{font-family:"Baloo 2";font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.isla .emo{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.isla h3{font-size:26px;font-weight:800}
.isla .cuerpo{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.isla .cuerpo p{margin:0;color:var(--suave);font-size:17px}
.isla .pie{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.estrellitas{font-size:22px;letter-spacing:2px}
.estrellitas .off{filter:grayscale(1);opacity:.25}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
.isla[disabled]{cursor:not-allowed}
.isla[disabled] .banda{background:#CFC8DA}
.isla[disabled] .cuerpo{opacity:.6}

/* ---------- Vista de reto ---------- */
.reto-cab{background:var(--c);color:#fff;border-radius:var(--radio);padding:20px 22px;display:flex;gap:16px;align-items:center;box-shadow:var(--sombra);position:relative;overflow:hidden}
.reto-cab::before{content:"";position:absolute;left:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.reto-cab .emo{font-size:60px;line-height:1;position:relative}
.reto-cab h2{font-size:clamp(28px,4.5vw,40px);font-weight:800}
.reto-cab p{margin:2px 0 0;opacity:.95}
.volver{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--suave);padding:8px 2px;margin-bottom:10px}
.pasos{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.paso{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid var(--borde);font-weight:800;color:var(--suave);font-size:16px}
.paso .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#F3EADB;font-size:14px}
.paso.activo{border-color:var(--c);color:var(--tinta)}
.paso.activo .n{background:var(--c);color:#fff}
.paso.hecho .n{background:var(--ok);color:#fff}

.tarjeta{background:var(--carta);border-radius:var(--radio);box-shadow:var(--sombra);padding:clamp(20px,4vw,34px);position:relative}
.tarjeta h3{font-size:clamp(24px,3.4vw,32px);font-weight:800;margin-bottom:10px}
.tarjeta .texto{font-size:19px}
.cita{margin:18px 0 6px;padding:16px 20px;border-left:7px solid var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:0 16px 16px 0;font-size:20px;font-style:italic}
.fuente{font-size:15px;color:var(--suave);font-weight:700}
.fuente::before{content:"📖 "}
.contador{position:absolute;top:18px;right:20px;font-weight:800;color:var(--suave);font-size:15px}
.puntos-nav{display:flex;gap:8px;justify-content:center;margin:18px 0 4px}
.puntos-nav i{width:11px;height:11px;border-radius:50%;background:#E6DBC8;transition:all .3s}
.puntos-nav i.on{background:var(--c);width:30px;border-radius:99px}
.acciones{display:flex;gap:12px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:16px;font-weight:800;font-size:18px;
  background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#000);transition:transform .1s, box-shadow .1s;min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 70%,#000)}
.btn.sec{background:#fff;color:var(--tinta);box-shadow:0 5px 0 var(--borde);border:2px solid var(--borde)}
.btn.grande{font-size:21px;padding:16px 30px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* juego */
.zona-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.etiqueta{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.vidas{font-weight:800;color:var(--suave);font-size:16px}
.instr{font-size:20px;font-weight:700;margin:0 0 14px}
.frase{font-size:clamp(21px,3vw,26px);line-height:2.1;font-family:"Baloo 2";font-weight:600;background:#FFFCF6;border:2px dashed var(--borde);border-radius:18px;padding:16px 20px}
.hueco{display:inline-block;min-width:110px;text-align:center;border-bottom:4px solid #D9CCB6;margin:0 4px;padding:0 8px;line-height:1.3;color:#B9AC98}
.hueco.activo{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:10px 10px 0 0;animation:late 1.2s infinite}
.hueco.lleno{color:var(--ok);border-color:var(--ok);font-weight:800}
@keyframes late{50%{background:color-mix(in srgb,var(--c) 26%,#fff)}}
.fichas{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ficha{padding:12px 18px;border-radius:14px;background:#fff;border:3px solid var(--c);font-weight:800;font-size:19px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#fff);transition:transform .1s}
.ficha:hover{transform:translateY(-2px)}
.ficha.usada{visibility:hidden}
.opciones{display:grid;gap:12px}
.opcion{text-align:left;padding:16px 18px;border-radius:16px;background:#fff;border:3px solid var(--borde);font-size:19px;font-weight:700;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s, transform .1s}
.opcion:hover:not([disabled]){border-color:var(--c);transform:translateX(3px)}
.opcion .letra{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 70%,#000);font-family:"Baloo 2";font-weight:800}
.opcion.bien{border-color:var(--ok);background:var(--okfondo)}
.opcion.bien .letra{background:var(--ok);color:#fff}
.opcion.malo{border-color:var(--mal);background:var(--malfondo)}
.opcion.malo .letra{background:var(--mal);color:#fff}
.opcion[disabled]{cursor:default}
.escenario{font-size:20px;font-weight:700;background:#FFFCF6;border:2px dashed var(--borde);border-radius:18px;padding:16px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}
.escenario .emo{font-size:36px;line-height:1}
.retro{margin-top:16px;border-radius:16px;padding:16px 18px;font-size:18px;animation:aparece .35s ease}
.retro.si{background:var(--okfondo);border:2px solid #86EFAC}
.retro.no{background:var(--malfondo);border:2px solid #FDA4AF}
.retro b.t{display:block;font-family:"Baloo 2";font-size:22px;margin-bottom:4px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}}
.botes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bote{padding:18px 12px;border-radius:18px;font-weight:800;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid;background:#fff;transition:transform .1s}
.bote .emo{font-size:38px}
.bote.a{border-color:var(--verde);box-shadow:0 5px 0 #A7F0CB}
.bote.b{border-color:var(--coral);box-shadow:0 5px 0 #FFC2CF}
.bote:active{transform:translateY(4px)}
.bote[disabled]{opacity:.45}
.cuenta-botes{display:flex;gap:12px;justify-content:center;margin-top:12px;font-weight:800;color:var(--suave);font-size:16px}
.linea{position:relative;margin:4px 0 18px;padding-left:26px;min-height:30px}
.linea::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:4px;border-radius:4px;background:var(--borde)}
.hito{position:relative;background:#fff;border:2px solid var(--ok);border-radius:14px;padding:10px 14px;margin-bottom:10px;animation:aparece .35s ease;font-size:17px}
.hito::before{content:"";position:absolute;left:-23px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:3px solid #fff;box-shadow:0 0 0 2px var(--ok)}
.hito b{font-family:"Baloo 2";font-size:20px;color:var(--ok);margin-right:6px}
.hito.vacio{border:2px dashed var(--borde);color:#B9AC98;font-weight:700}
.hito.vacio::before{background:#E6DBC8;box-shadow:0 0 0 2px #E6DBC8}
.monton{display:grid;gap:10px}
.monton .opcion{font-size:17px}
.sacude{animation:sacude .4s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.reflexion label{display:block;font-weight:800;font-size:19px;margin:18px 0 8px}
.reflexion textarea{width:100%;min-height:96px;border-radius:16px;border:2px solid var(--borde);padding:14px;font:inherit;font-size:17px;background:#FFFCF6;resize:vertical}
.idea{margin-top:20px;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 60%,#FFC93C));color:#fff;border-radius:18px;padding:18px 20px;font-family:"Baloo 2";font-size:clamp(22px,3vw,28px);font-weight:700}
.idea small{display:block;font-family:"Nunito";font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.lecturas{margin:14px 0 0;padding-left:22px;color:var(--suave)}

/* ---------- Modal ---------- */
.velo{position:fixed;inset:0;background:rgba(30,27,75,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px;animation:aparece .3s}
.modal{background:#fff;border-radius:28px;max-width:520px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);max-height:92vh;overflow:auto}
.modal h2{font-size:38px;font-weight:800;color:var(--c)}
.modal .grandes{font-size:54px;letter-spacing:6px;margin:8px 0}
.modal .grandes span{display:inline-block;animation:pop .5s backwards}
.modal .grandes .off{filter:grayscale(1);opacity:.25}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}}
.modal .faro-mini{width:110px;margin:0 auto}
.modal .acciones{justify-content:center}
canvas#confeti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- Plan / Biblioteca ---------- */
.sesiones{display:grid;gap:16px}
.sesion{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:18px 20px;border-left:10px solid var(--c);display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.sesion .emo{font-size:42px;grid-row:span 3}
.sesion h3{font-size:24px;font-weight:800}
.sesion ul{margin:4px 0 0;padding-left:20px;color:var(--suave);font-size:17px}
.sesion .preg{font-size:17px;font-style:italic}
.guia{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:18px 22px;margin-bottom:20px}
.guia ol{margin:8px 0 0;padding-left:22px}
.guia li{margin:4px 0}
.glosario{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.termino{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:18px 20px;border-top:8px solid var(--c)}
.termino h3{font-size:22px;font-weight:800;margin-bottom:6px}
.termino p{margin:0 0 6px;font-size:17px}
.termino q{font-style:italic}
.fuentes{columns:2 300px;font-size:16px;color:var(--suave)}
.nota{font-size:15px;color:var(--suave);margin-top:28px;text-align:center}

/* ---------- Certificado ---------- */
.cert{background:#fff;border-radius:28px;box-shadow:var(--sombra);padding:clamp(24px,5vw,48px);text-align:center;position:relative;overflow:hidden;border:10px solid transparent;
  background-image:linear-gradient(#fff,#fff),linear-gradient(120deg,var(--sol),var(--naranja),var(--coral),var(--violeta),var(--azul),var(--turquesa),var(--verde));
  background-origin:border-box;background-clip:padding-box,border-box}
.cert .faro-box{margin:0 auto 6px;width:150px}
.cert h2{font-size:clamp(30px,5vw,46px);font-weight:800}
.cert .nombre{font-family:"Baloo 2";font-size:clamp(30px,6vw,52px);font-weight:800;background:linear-gradient(90deg,var(--violeta),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0;min-height:1.2em}
.cert input{font:inherit;font-size:20px;padding:12px 16px;border-radius:14px;border:2px solid var(--borde);width:min(420px,100%);text-align:center}
.bloqueado{text-align:center;padding:40px 20px}
.bloqueado .emo{font-size:70px}

/* faro svg */
.rayo{opacity:.75;transition:opacity .9s ease}
.rayo.off{opacity:.07}
.faro-gira .haz{transform-origin:100px 58px;animation:gira 6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.luz{animation:brilla 2.4s infinite ease-in-out}
@keyframes brilla{50%{opacity:.6}}

@media (max-width:640px){
  body{font-size:17px}
  .cab{grid-template-columns:1fr}
  .faro-box.cab-faro{position:absolute;right:-6px;top:-4px;width:110px;opacity:.95}
  .cab h1,.cab p.lema,.marca{padding-right:96px}
  .cab p.lema{padding-right:70px}
  .botes{grid-template-columns:1fr}
  .reto-cab .emo{font-size:46px}
  .acciones .btn{flex:1 1 auto}
}
@media print{
  .cielo,nav.tabs,.no-imprimir,.nota{display:none!important}
  body{background:#fff}
  main{padding:0}
  .cert{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="cielo">
  <div class="estrellas" id="estrellas" aria-hidden="true"></div>
  <div class="cab">
    <div>
      <div class="marca">Unicidad de propósito · 6 retos</div>
      <h1>El Faro</h1>
      <p class="lema">Una sola misión: llevar el mensaje al alcohólico que aún sufre. Completa los 6 retos y enciende cada rayo del faro.</p>
      <div class="marcador">
        <span class="pill">⭐ <span id="m-estrellas">0</span>/18</span>
        <span class="pill">💎 <span id="m-puntos">0</span> pts</span>
        <span class="pill">🗼 <span id="m-retos">0</span>/6 rayos</span>
      </div>
    </div>
    <div class="faro-box cab-faro" id="faro-cab"></div>
  </div>
  <svg class="olas" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#FFF8EC" d="M0,30 C180,60 360,0 540,25 C720,50 900,5 1080,28 C1260,50 1350,20 1440,30 L1440,60 L0,60 Z"/>
  </svg>
</header>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button class="tab" data-vista="mapa">🗺️ Retos</button>
    <button class="tab" data-vista="plan">📅 Plan de estudio</button>
    <button class="tab" data-vista="biblio">📚 Biblioteca</button>
    <button class="tab" data-vista="cert">🏅 Certificado</button>
    <button class="tab sonido" id="btn-sonido" aria-pressed="true">🔊 Sonido</button>
  </div>
</nav>

<main id="app" tabindex="-1"></main>
<canvas id="confeti" aria-hidden="true"></canvas>
<div id="vivo" class="sr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<script>
/* =========================================================
   CONTENIDO — basado en literatura de A.A. y documentos de servicio
   ========================================================= */
const COLORES = ["#FF9F1C","#14B8A6","#EC4899","#22B573","#F43F5E","#6366F1"];

const RETOS = [
/* ---------------- RETO 1 ---------------- */
{
  emo:"💡", titulo:"La luz del faro", sub:"¿Qué es la unicidad de propósito?",

let ctx;
function tono(frecs, dur=.12, tipo="sine", vol=.12){
  if(!S.sonido) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    frecs.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+i*dur;
      o.type=tipo; o.frequency.value=f;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur*1.8);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur*2);
    });
  }catch(e){}
}
const sBien = () => tono([660,880],.09,"triangle");
const sMal  = () => tono([220,180],.12,"sawtooth",.05);
const sGana = () => tono([523,659,784,1047,1319],.11,"triangle",.13);
const sClic = () => tono([520],.05,"sine",.05);

function faroSVG(lit, gira=false){
  const rayos = RETOS.map((r,i)=>{
    const ang = [-172,-146,-120,-60,-34,-8][i];    // 3 rayos a cada lado
    const a1=(ang-9)*Math.PI/180, a2=(ang+9)*Math.PI/180, L=150;
    const x1=100+L*Math.cos(a1), y1=58+L*Math.sin(a1), x2=100+L*Math.cos(a2), y2=58+L*Math.sin(a2);
    return `<polygon class="rayo ${lit[i]?'':'off'}" points="100,58 ${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="${r.color}"/>`;
  }).join("");
  const todos = lit.every(Boolean);
  return `<svg viewBox="0 0 200 230" class="${gira&&todos?'faro-gira':''}" role="img" aria-label="Faro con ${lit.filter(Boolean).length} de 6 rayos encendidos">
    <g class="haz">${rayos}</g>

}
function pintarAprende(){
  const r=R.r, k=R.tarjeta, c=r.aprende[k], n=r.aprende.length;
  $("#zona").innerHTML = `
    <article class="tarjeta" style="animation:aparece .35s">
      <span class="contador">${k+1} / ${n}</span>
      <h3>${c.t}</h3>
      <div class="texto">${c.x}</div>
      ${c.c?`<blockquote class="cita">“${c.c}”</blockquote>`:''}
      ${c.f?`<div class="fuente">${c.f}</div>`:''}
      ${k===0?`<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:800;color:var(--suave)">📚 Lectura sugerida para esta sesión</summary><ul class="lecturas">${r.lecturas.map(l=>`<li>${l}</li>`).join("")}</ul></details>`:''}
      <div class="puntos-nav">${r.aprende.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join("")}</div>
      <div class="acciones">
        <button class="btn sec" id="ant" ${k===0?'disabled':''}>← Anterior</button>
        <button class="btn" id="sig">${k===n-1?'¡A jugar! 🎮':'Siguiente →'}</button>
      </div>
    </article>`;
  $("#ant").onclick=()=>{ sClic(); R.tarjeta--; pintarAprende(); };
  $("#sig").onclick=()=>{ sClic(); if(k===n-1){ R.fase="juega"; R.act=0; pintarReto(); } else { R.tarjeta++; pintarAprende(); } };
}

function pintarActividad(){
  const a = R.r.juego[R.act];
  const fin = () => { R.act++; if(R.act>=R.r.juego.length){ R.fase="reflexiona"; pintarReto(); } else pintarActividad(); window.scrollTo({top:0,behavior:"smooth"}); };
  ({fill:actCompletar, quiz:actPreguntas, sort:actClasificar, order:actOrdenar})[a.tipo](a, fin);
}
function cabActividad(titulo, extra=""){
  return `<div class="zona-cab"><span class="etiqueta">🎮 ${titulo}${R.r.juego.length>1?` · parte ${R.act+1} de ${R.r.juego.length}`:''}</span><span class="vidas">${extra}</span></div>`;
}
function acierto(){ R.aciertos++; sumar(10); sBien(); }
function error(el){ R.errores++; sMal(); if(el){ el.classList.remove("sacude"); void el.offsetWidth; el.classList.add("sacude"); } }

/* Completar la frase */
function actCompletar(a, fin){
  let pos=0; const usadas=new Set();
  const fichas = barajar([...a.respuestas, ...a.distractores]);
  const dibujar = () => {
    const listo = pos===a.respuestas.length;
    $("#zona").innerHTML = `<div class="tarjeta">${cabActividad("Completa la frase")}
      <p class="instr">${a.instruccion}</p>
      <div class="frase" id="frase">${a.partes.map(p=> typeof p==="number"
          ? `<span class="hueco ${p<pos?'lleno':''} ${p===pos?'activo':''}">${p<pos?a.respuestas[p]:'?'}</span>` : esc(p)).join("")}</div>
      ${listo?`<div class="retro si"><b class="t">¡Perfecto! 🎉</b><span class="fuente">${a.f}</span></div><div class="acciones"><span></span><button class="btn" id="cont">Continuar →</button></div>`
        :`<div class="fichas">${fichas.map((w,j)=>`<button class="ficha ${usadas.has(j)?'usada':''}" data-j="${j}">${w}</button>`).join("")}</div>`}
    </div>`;
    if(listo){ $("#cont").onclick=fin; return; }
    $("#zona").querySelectorAll(".ficha").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;
      if(fichas[j]===a.respuestas[pos]){ usadas.add(j); pos++; acierto(); anunciar("Correcto: "+fichas[j]); dibujar(); }
      else { error(b); anunciar("Esa no es. Intenta otra palabra."); }
    });
  };
  dibujar();
}

/* Preguntas / escenarios / dilemas / ¿quién lo dijo? */
function actPreguntas(a, fin){
  let q=0;
  const dibujar = () => {
    const P=a.preguntas[q];
    const ops = P._ops || (P._ops = barajar(P.o));
    $("#zona").innerHTML = `<div class="tarjeta">${cabActividad(a.titulo||"Preguntas", `${q+1} / ${a.preguntas.length}`)}
      ${P.cita?`<blockquote class="cita" style="margin-top:0">“${P.cita}”</blockquote>`:''}
      ${P.emo?`<div class="escenario"><span class="emo">${P.emo}</span><span>${P.p}</span></div>`:`<p class="instr">${P.p}</p>`}
      <div class="opciones">${ops.map((o,j)=>`<button class="opcion" data-j="${j}"><span class="letra">${"ABCD"[j]}</span><span>${o.t}</span></button>`).join("")}</div>
      <div id="retro" aria-live="polite"></div>
    </div>`;
    const botones=[...$("#zona").querySelectorAll(".opcion")];
    botones.forEach(b=>b.onclick=()=>{
      const o=ops[+b.dataset.j], bien=!!o.ok;
      botones.forEach(x=>x.disabled=true);
      const buena = ops.findIndex(x=>x.ok);
      botones[buena].classList.add("bien");
      if(bien) acierto(); else { b.classList.add("malo"); error(b); }
      const fbBuena = ops[buena].fb;
      let txt = o.fb || "";
      if(!bien && fbBuena) txt += (txt?"<br><br>":"") + "<b>La mejor respuesta:</b> " + fbBuena;
      if(P.e) txt += (txt?"<br><br>":"") + P.e;
      $("#retro").innerHTML = `<div class="retro ${bien?'si':'no'}"><b class="t">${bien?barajar(["¡Así es! ✨","¡Muy bien! 🎉","¡Exacto! 💡"])[0]:"Casi… 💭"}</b>${txt}</div>
        <div class="acciones"><span></span><button class="btn" id="sig">${q===a.preguntas.length-1?'Continuar →':'Siguiente →'}</button></div>`;
      $("#sig").focus({preventScroll:true});
      $("#sig").onclick=()=>{ q++; if(q>=a.preguntas.length) fin(); else { dibujar(); } };
    });
  };
  dibujar();
}

/* Clasificar en dos canastas */
function actClasificar(a, fin){
  const items = barajar(a.items); let k=0; const cuenta={};
  a.botes.forEach(b=>cuenta[b.id]=0);
  const dibujar = () => {
    const it=items[k];
    $("#zona").innerHTML = `<div class="tarjeta">${cabActividad("Clasifica", `${k+1} / ${items.length}`)}
      <p class="instr">${a.instruccion}</p>
      <div class="escenario" id="carta"><span class="emo">🃏</span><span>${it.t}</span></div>
      <div class="botes">${a.botes.map((b,j)=>`<button class="bote ${j?'b':'a'}" data-b="${b.id}"><span class="emo">${b.emo}</span>${b.t}</button>`).join("")}</div>
      <div class="cuenta-botes">${a.botes.map(b=>`<span>${b.emo} ${cuenta[b.id]}</span>`).join("")}</div>
      <div id="retro" aria-live="polite"></div>
    </div>`;
    const bs=[...$("#zona").querySelectorAll(".bote")];
    bs.forEach(b=>b.onclick=()=>{
      bs.forEach(x=>x.disabled=true);
      const bien = b.dataset.b===it.b;
      cuenta[it.b]++;
      if(bien) acierto(); else error($("#carta"));
      const nombre = a.botes.find(x=>x.id===it.b);
      $("#retro").innerHTML = `<div class="retro ${bien?'si':'no'}"><b class="t">${bien?'¡Correcto!':'Mira bien…'} ${nombre.emo} ${nombre.t}</b>${it.e}</div>
        <div class="acciones"><span></span><button class="btn" id="sig">${k===items.length-1?'Continuar →':'Siguiente →'}</button></div>`;
      $("#sig").focus({preventScroll:true});
      $("#sig").onclick=()=>{ k++; if(k>=items.length) fin(); else dibujar(); };
    });
  };
  dibujar();
}

/* Ordenar en la línea del tiempo */
function actOrdenar(a, fin){
  const monton = barajar(a.items.map((x,i)=>({...x,i}))); let pos=0;
  const dibujar = () => {
    const listo = pos===a.items.length;
    $("#zona").innerHTML = `<div class="tarjeta">${cabActividad("Línea del tiempo", `${pos} / ${a.items.length}`)}
      <p class="instr">${a.instruccion}</p>
      <div class="linea">
        ${a.items.slice(0,pos).map(x=>`<div class="hito"><b>${x.a}</b>${x.t}</div>`).join("")}
        ${listo?'':`<div class="hito vacio">¿Qué pasó ${pos===0?'primero':'después'}?</div>`}
      </div>
      ${listo?`<div class="retro si"><b class="t">¡Línea completa! 🧭</b>Más de 90 años aprendiendo lo mismo: la unicidad de propósito nos mantiene unidos.</div><div class="acciones"><span></span><button class="btn" id="cont">Continuar →</button></div>`
        :`<div class="monton">${monton.filter(x=>x.i>=pos).map(x=>`<button class="opcion" data-i="${x.i}"><span class="letra">?</span><span>${x.t}</span></button>`).join("")}</div>`}
    </div>`;
    if(listo){ $("#cont").onclick=fin; return; }
    $("#zona").querySelectorAll(".monton .opcion").forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===pos){ pos++; acierto(); dibujar(); }
      else { error(b); anunciar("Todavía no. Busca un acontecimiento más antiguo."); }
    });
  };
  dibujar();
}

/* Reflexión y cierre */
function pintarReflexion(){
  const r=R.r, i=R.i; S.notas[i]=S.notas[i]||[];
  $("#zona").innerHTML = `<div class="tarjeta reflexion">
      <div class="etiqueta">🪞 Para compartir con tu padrino, tu madrina o en tu grupo</div>
      ${r.reflexion.map((p,k)=>`<label for="n${k}">${k+1}. ${p}</label><textarea id="n${k}" data-k="${k}" placeholder="Escribe aquí si quieres (se guarda solo en tu dispositivo)…">${esc(S.notas[i][k]||"")}</textarea>`).join("")}
      <div class="idea"><small>Idea para llevar</small>${r.idea}</div>
      <div class="acciones"><button class="btn sec" id="repaso">↺ Repasar lectura</button><button class="btn grande" id="terminar">Encender mi rayo 🗼</button></div>
    </div>`;
  $("#zona").querySelectorAll("textarea").forEach(t=>t.oninput=()=>{ S.notas[i][+t.dataset.k]=t.value; guardar(); });
  $("#repaso").onclick=()=>{ R.fase="aprende"; R.tarjeta=0; pintarReto(); };
  $("#terminar").onclick=terminarReto;
}
function terminarReto(){
  const i=R.i, e=R.errores, est = e<=1?3:e<=3?2:1;
  const primera = !S.hechos[i];
  S.hechos[i]=true; S.estrellas[i]=Math.max(S.estrellas[i]||0, est);
  sumar(est*20 + (primera?50:0));
  guardar(); refrescarMarcador(); sGana(); confeti();
  const lit = RETOS.map((_,k)=>!!S.hechos[k]);
  const ultimo = totalHechos()===6;
  const velo=document.createElement("div"); velo.className="velo";
  velo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="--c:${R.r.color}">
    <div class="faro-mini">${faroSVG(lit, true)}</div>
    <h2 id="mt">${ultimo?'¡Faro encendido!':'¡Rayo encendido!'}</h2>
    <div class="grandes">${[0,1,2].map(k=>`<span class="${k<est?'':'off'}" style="animation-delay:${.2+k*.18}s">⭐</span>`).join("")}</div>
    <p style="margin:0 0 6px"><b>${R.aciertos}</b> aciertos · <b>${e}</b> ${e===1?'tropiezo':'tropiezos'}${primera?' · <b>+50</b> pts de bono':''}</p>
    <p style="color:var(--suave);margin:0 0 6px">${est===3?'¡Brillante! Dominas este reto.':est===2?'¡Muy bien! Puedes repetirlo para ganar 3 estrellas.':'Lo lograste. Repítelo cuando quieras para afianzarlo.'}</p>
    <div class="idea" style="text-align:left"><small>Idea para llevar</small>${R.r.idea}</div>
    <div class="acciones">
      <button class="btn sec" id="m-mapa">🗺️ Ver retos</button>
      ${ultimo?`<button class="btn" id="m-cert">🏅 Mi certificado</button>`: (i<5?`<button class="btn" id="m-sig">Reto ${i+2} →</button>`:'')}
    </div></div>`;
  document.body.appendChild(velo);
  const cerrar=(fn)=>{ velo.remove(); fn(); };
  velo.querySelector("#m-mapa").onclick=()=>cerrar(vistaMapa);
  const s=velo.querySelector("#m-sig"); if(s) s.onclick=()=>cerrar(()=>abrirReto(i+1));
  const c=velo.querySelector("#m-cert"); if(c) c.onclick=()=>cerrar(()=>ir_a("cert"));
  (s||c||velo.querySelector("#m-mapa")).focus();
}

function ir_a(v){
  document.documentElement.style.removeProperty("--c");
  ({mapa:vistaMapa, plan:vistaPlan, biblio:vistaBiblio, cert:vistaCert})[v]();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================================================
   CONFETI
   ========================================================= */
function confeti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#confeti"), cx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const piezas=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:4+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.3,
    c:COLORES[Math.floor(Math.random()*6)]}));
  let t=0;
  (function cuadro(){
    cx.clearRect(0,0,cv.width,cv.height);
    piezas.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.a+=p.va;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); cx.restore(); });
    if(++t<200) requestAnimationFrame(cuadro); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}
