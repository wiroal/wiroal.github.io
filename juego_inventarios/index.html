<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#f4efe3; --hoja:#fbf8f0; --ink:#1c1a17; --ink-2:#4a453c; --ink-3:#6f695c;
  --rule:#d9d2c1; --rule-2:#b8ae96; --accent:#a8431a; --accent-2:#6b2a0f; --gold:#8a6b2e;
  --suave:#f3e6d8; --ok:#2c6a43; --ok-s:#e2efe5; --mal:#9a2b1f; --mal-s:#f8e4e1; --azul:#2d5a7a; --azul-s:#e3edf3;
  --renglon:#c9d8e4; --margen:#d98f7b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#17130e; --hoja:#211b14; --ink:#efe7d8; --ink-2:#cfc5b2; --ink-3:#a69c89;
  --rule:#3a3126; --rule-2:#57493a; --accent:#e58a5c; --accent-2:#f0a97f; --gold:#d3ae62;
  --suave:#33241a; --ok:#7fcb99; --ok-s:#17301f; --mal:#f09a8c; --mal-s:#3a1e19; --azul:#8fbdd9; --azul-s:#172a36;
  --renglon:#2c3640; --margen:#6b3a2c;
}}
:root[data-tema="oscuro"]{
  --bg:#17130e; --hoja:#211b14; --ink:#efe7d8; --ink-2:#cfc5b2; --ink-3:#a69c89;
  --rule:#3a3126; --rule-2:#57493a; --accent:#e58a5c; --accent-2:#f0a97f; --gold:#d3ae62;
  --suave:#33241a; --ok:#7fcb99; --ok-s:#17301f; --mal:#f09a8c; --mal-s:#3a1e19; --azul:#8fbdd9; --azul-s:#172a36;
  --renglon:#2c3640; --margen:#6b3a2c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.18;margin:0}
p{margin:0 0 .8em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--accent)}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.tenue{color:var(--ink-3)}
.peq{font-size:.88rem}
.ancho{max-width:860px;margin:0 auto;padding:0 16px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:.45em 1em;border:1px solid var(--rule-2);border-radius:8px;background:var(--hoja);font-weight:600;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-tema="oscuro"] .btn.prim{color:#1c120b}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) .btn.prim{color:#1c120b}}
.btn.chico{min-height:36px;padding:.2em .7em;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.peligro{color:var(--mal);border-color:var(--mal)}

/* Barra superior */
.barra{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;background:#1b150f;color:#f2e8d6;border-bottom:2px solid #6b2a0f}
.barra .marca{background:none;border:0;color:#f6d38b;font-family:var(--serif);font-size:1.15rem;font-weight:600;padding:4px 6px;min-height:36px}
.barra .estado{font-size:.78rem;color:#cdbfa8;flex:1 1 140px;min-width:0}
.barra button.b{background:transparent;border:1px solid #6d5b45;color:#f2e8d6;border-radius:7px;min-height:36px;padding:.1em .65em;font-size:.84rem;font-weight:600}
.barra button.b:hover{border-color:#f6d38b}
.barra button.pausa{border-color:#f6d38b;color:#f6d38b}
.sprint{font-family:var(--mono);font-size:.9rem;color:#f6d38b;font-weight:700}

/* Portada / puerta */
.puerta{min-height:100vh;background:radial-gradient(1000px 500px at 50% -10%,#4b331d 0,#1b150f 62%);color:#f2e8d6;padding:32px 0 56px}
.puerta h1{font-size:clamp(2.3rem,8vw,3.8rem);color:#f6d38b;letter-spacing:-.01em}
.puerta .sub{font-family:var(--serif);font-size:1.2rem;margin:.4em 0 1.2em;color:#ecdfc9}
.puerta .cita{background:rgba(255,255,255,.05);color:#f2e8d6;border-left-color:#f6d38b}
.puerta .cita small{color:#cdbfa8}
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px;margin:18px 0}
.opcion{background:#2a2017;border:1px solid #5a4935;border-radius:12px;padding:18px}
.opcion h3{color:#f6d38b;font-size:1.2rem;margin-bottom:.35em}
.opcion p{font-size:.95rem;color:#e0d3bc}
.opcion label{display:block;font-size:.88rem;margin:.55em 0 .2em;color:#ecdfc9}
.opcion input{width:100%;min-height:44px;padding:.4em .6em;border-radius:7px;border:1px solid #6d5b45;background:#17120c;color:#f6efe2}
.opcion .btn{width:100%;margin-top:.8em}
.puerta .btn{background:#2a2017;color:#f2e8d6;border-color:#6d5b45}
.puerta .btn.prim{background:#f6d38b;border-color:#f6d38b;color:#21170c}
.puerta .btn.peligro{color:#f09a8c;border-color:#8a4a3e}
.aviso-puerta{font-size:.92rem;color:#d9ccb5;border-top:1px solid #4c3d2c;margin-top:22px;padding-top:14px}
.aviso-puerta strong{color:#f6d38b}
.error{color:#ffb4a4;font-size:.9rem;margin:.4em 0 0;min-height:1.2em}
.prueba{margin-top:10px;font-size:.92rem;min-height:1.4em}
.lista-suave{margin:.4em 0 .8em;padding-left:1.2em}
.lista-suave li{margin-bottom:.35em}

/* Mapa */
.mapa{position:relative;background:linear-gradient(#19130d,#241a11 45%,#19130d);color:#f2e8d6;padding:20px 0 44px;overflow:hidden;min-height:calc(100vh - 54px)}
.mapa h1{font-size:clamp(1.8rem,6vw,2.8rem);color:#f6d38b}
.mapa .ancho{position:relative;z-index:3}
.mapa .intro{font-family:var(--serif);font-size:1.08rem;color:#e7dac3;max-width:42em}
.escena{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:12px 0 2px;min-height:120px}
.espantajo-box{text-align:center;width:128px;flex:none}
.espantajo-box svg{display:block;margin:0 auto;transform-origin:bottom center;transition:transform .8s ease,opacity .8s ease}
.espantajo-box .quien{font-family:var(--serif);font-weight:600;color:#f6d38b}
.bocadillo{font:italic 1rem/1.3 var(--serif);color:#e7dac3;text-align:center;flex:1;padding:0 2px;align-self:center}
.progreso{height:10px;border-radius:99px;background:#3a2c1e;overflow:hidden;margin:12px 0 4px}
.progreso i{display:block;height:100%;background:linear-gradient(90deg,#c88a2f,#f6d38b);transition:width .7s}
.niebla{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:var(--niebla,.6);background:
  radial-gradient(520px 170px at 18% 34%,rgba(214,206,190,.2),transparent 70%),
  radial-gradient(640px 210px at 78% 54%,rgba(214,206,190,.2),transparent 70%),
  radial-gradient(520px 180px at 40% 84%,rgba(214,206,190,.17),transparent 70%);
  animation:deriva 26s ease-in-out infinite alternate;transition:opacity 1s}
@keyframes deriva{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.estantes{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px;margin-top:18px}
.estante{position:relative;display:flex;gap:12px;text-align:left;width:100%;padding:13px;border:1px solid #574532;border-bottom:6px solid #5c3f24;border-radius:9px 9px 3px 3px;background:#2a2017;color:#e7dac3;transition:transform .15s,box-shadow .3s,border-color .3s}
.estante:hover{transform:translateY(-2px);border-color:#c79a54}
.estante .num{font:600 .74rem var(--mono);color:#cdb58e;letter-spacing:.06em}
.estante h3{font-size:1.1rem;color:#f4e8d3;margin:.1em 0 .2em}
.estante p{font-size:.86rem;margin:0;line-height:1.38;color:#d6c8b0}
.estante .marcas{font-size:.74rem;margin-top:.45em;color:#cdb58e}
.estante svg{flex:none}
.estante.lit{background:#3b2a18;border-color:#d7a650;box-shadow:0 0 28px rgba(246,190,90,.28)}
.farol .llama{opacity:0}
.lit .farol .llama{opacity:1;animation:titila 2.4s infinite}
@keyframes titila{0%,100%{opacity:1}45%{opacity:.8}60%{opacity:.95}}
.sellos{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sello{font:600 .72rem/1.15 var(--sans);text-transform:uppercase;letter-spacing:.03em;padding:7px 9px;border:2px dashed #6d5b45;border-radius:8px;color:#8f8069;max-width:124px;text-align:center}
.sello.si{border:2px solid #d7a650;color:#f6d38b;transform:rotate(-2deg)}
.herramientas-mapa{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.mapa .btn{background:#2a2017;color:#f2e8d6;border-color:#6d5b45}
.mapa .btn.prim{background:#f6d38b;border-color:#f6d38b;color:#21170c}

/* Estante abierto */
.cab{padding:22px 0 8px}
.cab .num{font:600 .78rem var(--mono);letter-spacing:.08em;color:var(--accent)}
.cab h1{font-size:clamp(1.7rem,5.5vw,2.5rem);margin:.1em 0 .25em}
.cab .lema{font-family:var(--serif);font-size:1.1rem;color:var(--ink-2)}
.pestanas{display:flex;gap:6px;border-bottom:2px solid var(--rule-2);margin:14px 0 18px;position:sticky;top:53px;background:var(--bg);z-index:10;padding-top:6px}
.pestana{flex:1;background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:.5em .3em;min-height:44px;font-weight:600;color:var(--ink-2)}
.pestana[aria-selected="true"]{background:var(--hoja);border-color:var(--rule-2);color:var(--accent);margin-bottom:-2px;border-bottom:2px solid var(--hoja)}
.pestana .ok{color:var(--ok)}
.cita{border-left:4px solid var(--gold);background:var(--suave);padding:10px 14px;border-radius:0 8px 8px 0;font-family:var(--serif);font-size:1.03rem;margin:0 0 12px}
.cita small{display:block;font-family:var(--sans);color:var(--ink-3);font-size:.78rem;margin-top:4px}
.nota{background:var(--azul-s);border-left:4px solid var(--azul);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.94rem;margin:0 0 12px}
.nota.cuidado{background:var(--mal-s);border-left-color:var(--mal)}
.bloque{background:var(--hoja);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:16px}
.bloque h2{font-size:1.35rem;margin-bottom:.35em}
.bloque h3{font-size:1.1rem;margin-bottom:.3em}
.navega{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:20px 0 48px}
.encender{background:var(--suave);border:1px dashed var(--gold);border-radius:10px;padding:16px;margin:20px 0;text-align:center}

/* Retos */
.reto{background:var(--hoja);border:1px solid var(--rule-2);border-radius:12px;padding:16px;margin-bottom:16px}
.reto h3{font-size:1.2rem}
.reto .instr{color:var(--ink-2);font-size:.95rem;margin:.25em 0 .7em}
.ronda{font:600 .76rem var(--mono);color:var(--ink-3)}
.carta{font-family:var(--serif);font-size:1.16rem;line-height:1.4;padding:16px;border:1px solid var(--rule-2);border-radius:10px;background:var(--bg);margin:8px 0 12px}
.botes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{width:100%;text-align:left;min-height:44px;padding:.55em .8em;border:1px solid var(--rule-2);border-radius:8px;background:var(--bg);line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.bien{background:var(--ok-s);border-color:var(--ok)}
.opt.mal{background:var(--mal-s);border-color:var(--mal)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lista-op{display:grid;gap:8px}
.retro{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.95rem}
.retro.bien{background:var(--ok-s)}.retro.mal{background:var(--mal-s)}
.retro .cita{background:transparent;margin:.5em 0 0;padding:0 0 0 10px;font-size:.97rem}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hecho{color:var(--ok);font-weight:700}
.parejas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.parejas .col{display:grid;gap:8px;align-content:start}
.parejas .opt{font-size:.9rem}
@media (max-width:520px){.parejas .opt{font-size:.82rem;padding:.45em .5em}}
.orden li{margin-bottom:6px}
.orden{padding-left:1.4em;margin:.5em 0}
.jefe{display:flex;align-items:flex-end;gap:12px;background:#231a12;color:#f2e8d6;border-radius:10px;padding:12px;margin:8px 0}
.jefe svg{flex:none;transform-origin:bottom center;transition:transform .5s}
.jefe .dice{font:italic 1.15rem/1.35 var(--serif)}
.jefe .quien{color:#f6d38b;font:600 .8rem var(--mono);display:block;margin-bottom:.25em}

/* Hoja de libro contable */
.form-bloque{margin-bottom:22px}
.form-bloque>h2{font-size:1.32rem;margin-bottom:.25em}
.origen{display:inline-block;font:600 .68rem var(--sans);text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;background:var(--suave);color:var(--accent-2);margin-right:.4em}
.origen.h{background:var(--azul-s);color:var(--azul)}
.campo{margin-bottom:12px}
.campo>label,.campo>.et{display:block;font-weight:600;font-size:.94rem;margin-bottom:.2em}
.campo .ay{display:block;font-size:.82rem;color:var(--ink-3);margin-bottom:.25em;font-weight:400}
input[type=text],textarea{width:100%;border:1px solid var(--rule-2);border-radius:6px;padding:.45em .6em;background:var(--hoja);min-height:44px}
textarea{resize:vertical;min-height:88px;font-family:var(--serif);font-size:1.03rem;line-height:28px;padding:0 .6em 0 26px;
  background-image:linear-gradient(90deg,transparent 17px,var(--margen) 17px,var(--margen) 18px,transparent 18px),repeating-linear-gradient(transparent,transparent 27px,var(--renglon) 27px,var(--renglon) 28px);background-attachment:local}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-2);background:var(--bg);border-radius:99px;padding:.2em .8em;min-height:38px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-tema="oscuro"] .chip[aria-pressed="true"]{color:#1c120b}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) .chip[aria-pressed="true"]{color:#1c120b}}
input[type=range]{width:100%;min-height:36px;accent-color:var(--accent)}
.rango-val{font:600 .88rem var(--mono);color:var(--accent)}
.fila{border:1px solid var(--rule-2);border-left:5px solid var(--accent);border-radius:8px;background:var(--hoja);margin-bottom:10px}
.fila>summary{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:44px;cursor:pointer;font-weight:600;list-style:none}
.fila>summary::-webkit-details-marker{display:none}
.fila>summary::before{content:"▸";color:var(--accent)}
.fila[open]>summary::before{content:"▾"}
.fila .resumen-txt{flex:1;min-width:0}
.fila .cuerpo{padding:2px 12px 12px;border-top:1px solid var(--rule)}
.fila .cuerpo .campo:first-child{margin-top:10px}
.pregunta{padding:12px 0;border-top:1px solid var(--rule)}
.pregunta label{display:block;font-family:var(--serif);font-size:1.04rem;font-weight:600;line-height:1.35;margin-bottom:.4em}
.pregunta.foco{background:var(--suave);box-shadow:0 0 0 8px var(--suave)}
.cada{padding:12px 0;border-top:1px solid var(--rule)}
.cada h3{font-size:1.15rem}
.sugeridos{display:flex;flex-wrap:wrap;gap:5px;margin:.3em 0 .8em}
.sugeridos button{border:1px dashed var(--rule-2);background:none;border-radius:99px;padding:.1em .7em;min-height:34px;font-size:.84rem;color:var(--ink-2)}
.vigia{font-size:.9rem;border-radius:7px;padding:8px 11px;margin-top:6px;background:var(--suave);border-left:3px solid var(--gold)}
.vigia.grave{background:var(--mal-s);border-left-color:var(--mal)}
.vigia strong{display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* Línea de vida, balance */
.graf{width:100%;height:auto;display:block}
.graf text{font:12px var(--sans);fill:var(--ink-2)}
.barras{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(100px,170px) 1fr 34px;gap:8px;align-items:center;font-size:.9rem}
.bar .pista{height:14px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar .pista i{display:block;height:100%;background:var(--accent)}
.bar .v{text-align:right;font-family:var(--mono);font-size:.85rem}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px}
.etiqueta{padding:.1em .6em;border:1px solid var(--rule-2);border-radius:6px;font-size:.92rem}
.etiqueta b{color:var(--accent);margin-left:.25em}
.rejilla2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.selector label{display:flex;gap:9px;align-items:center;min-height:36px;font-size:.95rem}
.selector input{width:18px;height:18px;accent-color:var(--accent)}

/* Capas */
.capa{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,10,6,.78);overflow:auto}
.modal{background:var(--hoja);color:var(--ink);border-radius:14px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.modal h2{font-size:1.5rem;margin-bottom:.35em}
.respira{width:120px;height:120px;border-radius:50%;margin:10px auto 14px;background:radial-gradient(circle,#f6d38b,#c88a2f);animation:respira 10s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(.55)}40%{transform:scale(1)}50%{transform:scale(1)}}
.cortina{position:fixed;inset:0;z-index:90;background:#fff;color:#999;display:flex;align-items:flex-end;justify-content:center;padding:24px;font:13px var(--sans);border:0;width:100%;cursor:default}
.tostadas{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.tostada{background:#21170c;color:#f6d38b;border:1px solid #d7a650;border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4)}
@media (max-width:640px){.pestanas{position:static}.barra .estado{order:9;flex-basis:100%;font-size:.72rem}.barra{gap:3px 4px;padding:6px 8px}.barra .marca{flex:1;text-align:left;font-size:1rem;padding:4px 2px;white-space:nowrap}.barra button.b{padding:.1em .45em}.barra .largo{display:none}.barra .estado{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.barra,.navega,.tools{display:none}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Esta herramienta necesita JavaScript, pero nada de lo que escribas sale de tu equipo.</p></noscript>
<div id="app"></div>
<script>
"use strict";
/* ===== Contenido =====
   Cada cita de la literatura se declara con cita(texto, fuente) y queda en CITAS.
   LG = Alcohólicos Anónimos (Libro Grande); DD = Doce Pasos y Doce Tradiciones.
   Las páginas siguen la numeración impresa de las ediciones en español usadas. */
const CITAS = [];
const FUENTES = { LG: "Alcohólicos Anónimos (Libro Grande)", DD: "Doce Pasos y Doce Tradiciones" };
function cita(t, f){ const c = { t, f }; CITAS.push(c); return c; }
function refCita(f){ const [l, p] = f.split(" "); return FUENTES[l] + ", " + (p.includes("-") ? "pp. " : "p. ") + p; }

function h(tag, attrs, ...hijos){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  hijos.flat(Infinity).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); });
  return e;
}

function balance(){
  const resent = filasDe("resent");

  const afecta = conteo(resent, "afecta", OP_AFECTA);
  const parte = conteo(resent, "parte", OP_PARTE);
  const conTemor = resent.filter(x => Array.isArray(x.temor) && x.temor.length).length;
  const siete = verObj("siete"), flaq = forma("siete").items.map(it => [it.t, Number((siete[it.k] || {}).nivel) || 0]);
  const pulso = verObj("pulso"), inst = forma("pulso").items.map(it => [it.t, Number((pulso[it.k] || {}).nivel) || 0]);
  const roles = conteo(filasDe("vinculos"), "rol", ["Dominar", "Depender", "Destacarme", "Esconderme"]);
  // Personas que aparecen en más de una lista.
  const listas = [["resent", "resentimientos"], ["relaciones_sex", "sexo y pareja"], ["vinculos", "relaciones"], ["heridos", "personas heridas"]];
  const nombres = new Map();
  for (const [id, nom] of listas) for (const fl of filasDe(id)) {
    const n = String(fl.quien || "").trim(); if (!n) continue;
    const k = sinTildes(n).replace(/[^a-z0-9ñ ]/g, "").replace(/^(mi|el|la) /, "");
    if (!nombres.has(k)) nombres.set(k, { n, en: new Set() });
    nombres.get(k).en.add(nom);
  }
  const nudos = [...nombres.values()].filter(x => x.en.size > 1).map(x => [x.n, [...x.en]]).sort((a, b) => b[1].length - a[1].length);
  // Palabras repetidas en lo escrito.
  const frec = {};
  const recorrer = v => {
    if (typeof v === "string") (v.toLowerCase().match(/[a-záéíóúñü]{4,}/g) || []).forEach(p => { if (!VACIAS.has(p)) frec[p] = (frec[p] || 0) + 1; });
    else if (Array.isArray(v)) v.forEach(x => { if (typeof x === "object") recorrer(x); });
    else if (v && typeof v === "object") Object.values(v).forEach(recorrer);
  };
  const excluir = new Set(["pacto"]);
  Object.entries(S.datos).forEach(([k, v]) => { if (!excluir.has(k)) recorrer(v); });
  const palabras = Object.entries(frec).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]).slice(0, 14);
  return { totalR: resent.length, afecta, parte, conTemor, temores: filasDe("miedos").length, flaq, inst, roles, nudos, palabras,
    virtudes: filasDe("buenas").filter(x => valor(x.virtud)).length, heridos: filasDe("heridos").filter(x => valor(x.quien)).length };
}

    h("p", {}, "El inventario se lleva al Quinto Paso: se admite ante Dios, ante uno mismo y ante otro ser humano. Elige con tu padrino con quién y cuándo. No hay que esperar a que esté perfecto."),
    citaH(cita("Puesto que el Cuarto Paso no es sino el mero comienzo de una práctica que nos habrá de durar toda la vida", "DD 47")));
  return h("main", { class: "ancho" },
    h("header", { class: "cab" }, h("div", { class: "num" }, "EL MOSTRADOR"), h("h1", {}, "Balance y papel"), h("p", { class: "lema" }, "Lo que se contó en la bodega, puesto sobre la mesa.")),
    balanceH, pdf, retoF, despues, copia,
    h("nav", { class: "navega" }, h("button", { type: "button", class: "btn", onclick: () => ir({ nombre: "mapa" }) }, "← Volver a la bodega")));

function sacarCopia(){

/* ===== PDF del cuaderno ===== */
function textoCampo(def, v){
  if (Array.isArray(v)) return v.join(", ");
  if (v == null || v === "") return "";
  if (def.tipo === "rango") return `${v}`;
  return String(v);
}
function formaEnPDF(p, f, blanco){
  p.titulo(f.titulo, 2);
  if (f.tipo === "filas" && f.id === "resent") {
    const cols = [
      { et: "RESENTIDO CON", w: 19, v: r => r.quien || "" },
      { et: "LA CAUSA", w: 28, v: r => r.causa || "" },
      { et: "AFECTA MI(S)", w: 19, v: r => [...(r.afecta || []), ...(r.temor || [])].join("\n") },
      { et: "MI PARTE", w: 34, v: r => [(r.parte || []).join(", "), r.culpa || "", r.enfermo ? "Amigo enfermo: " + r.enfermo : "", r.dispuesto ? "Dispuesto a enmendar: " + r.dispuesto : ""].filter(Boolean).join("\n") },
    ];
    if (blanco) return p.tabla(cols, [], 12);
    const filas = filasDe(f.id).filter(r => Object.values(r).some(valor));
    return filas.length ? p.tabla(cols, filas) : p.parrafo("(Sin renglones.)", { color: GRIS });
  }
  const campoP = (c, v) => {
    if (blanco) {
      if (c.tipo === "chips" || c.tipo === "opcion") return p.parrafo(c.et + ":  " + c.ops.map(o => "[  ] " + o).join("    "), { z: 9.5, tras: 6 });
      if (c.tipo === "rango") { const r = []; for (let n = c.min; n <= c.max; n++) r.push(n); return p.parrafo(c.et + ":  " + r.join("   "), { z: 9.5, tras: 6 }); }
      p.parrafo(c.et, { f: F_NEG, z: 9.5, tras: 0 });
      return p.renglones(c.tipo === "area" ? Math.min(c.filas || 3, 5) : 1);
    }
    const t = textoCampo(c, v);
    if (!t) return;
    p.parrafo(c.et, { f: F_NEG, z: 8.8, color: GRIS, tras: 0 });
    p.parrafo(t, { f: F_SERIF, z: 11, lead: 14.5, tras: 6 });
  };
  if (f.tipo === "filas") {
    const filas = blanco ? [{}, {}, {}] : filasDe(f.id).filter(r => Object.values(r).some(valor));
    if (!filas.length) return p.parrafo("(Sin renglones.)", { color: GRIS });
    if (f.grafica && !blanco && puntosVida().length) p.lineaVida(puntosVida());
    filas.forEach((r, i) => {
      p.espacio(40);
      p.parrafo(blanco ? `Renglón ${i + 1}` : (r[f.resumen] || `Renglón ${i + 1}`), { f: F_NEG, z: 10.5, color: OCRE, tras: 3 });
      f.campos.forEach(c => { if (blanco || c.k !== f.resumen) campoP(c, r[c.k]); });
      p.y -= 3;
      p.linea(p.M, p.y, p.W - p.M, p.y); p.y -= 4;
    });
    return;
  }
  if (f.tipo === "preguntas") {
    const o = verObj(f.id); let alguna = false;
    f.items.forEach((it, i) => {
      const r = typeof o[i] === "string" ? o[i].trim() : "";
      if (!r && !blanco) return;
      alguna = true;
      p.espacio(38);
      p.parrafo(it.q, { f: F_NEG, z: 9.6, tras: 1 });
      if (blanco) p.renglones(3); else p.parrafo(r, { f: F_SERIF, z: 11, lead: 14.5, tras: 8 });
    });
    if (!alguna) p.parrafo("(Sin respuestas.)", { color: GRIS });
    return;
  }
  if (f.tipo === "cada") {
    const o = verObj(f.id);
    f.items.forEach(it => {
      const dat = o[it.k] || {};
      if (!blanco && !Object.values(dat).some(v => valor(v) || Number(v) > 0)) return;
      p.titulo(it.t + (!blanco && dat.nivel != null ? `  (${dat.nivel} de 5)` : ""), 3);
      f.campos.filter(c => c.tipo !== "rango" || blanco).forEach(c => campoP(c, dat[c.k]));
    });
    return;
  }
  const o = verObj(f.id);
  f.campos.forEach(c => campoP(c, o[c.k]));
}
function generarPDF(estantes, op){
  if (!estantes.length) return tostada("Marca al menos un estante.");
  const p = new HojaPDF();
  const pacto = verObj("pacto");
  p.y -= 110;
  p.parrafo("Personal y confidencial", { f: F_NEG, z: 10, color: OCRE, tras: 12 });
  p.titulo(op.blanco ? "Hojas para el Cuarto Paso" : "Mi inventario", 0);
  p.parrafo(op.blanco ? "Plantillas para escribir a mano" : "Historia e inventarios del Cuarto Paso", { f: F_ITA, z: 14, tras: 14 });
  if (!op.blanco && valor(pacto.iniciales)) p.parrafo(pacto.iniciales, { f: F_SERIF, z: 13, tras: 2 });
  p.parrafo(new Date().toLocaleDateString("es-CO", { year: "numeric", month: "long", day: "numeric" }), { f: F_SERIF, z: 12, color: GRIS, tras: 24 });
  p.citaP(CITA_PASO);
  p.y -= 16;
  p.parrafo("Si este documento llega a sus manos por error, por favor no lo lea y devuélvalo a su dueño. Es un ejercicio íntimo de recuperación.", { z: 9.5, color: GRIS });
  p.parrafo("Hecho con La Bodega, una herramienta personal. No es literatura de A.A. ni está aprobada por A.A. Las citas llevan la página de las ediciones en español usadas.", { z: 8.5, color: GRIS });
  if (op.balance && contarEscrito() > 0) {
    p.nueva();
    p.titulo("Balance general", 1);
    p.parrafo("Material para conversar con el padrino. No es un diagnóstico.", { f: F_ITA, z: 10.5, color: GRIS, tras: 8 });
    const b = balance();
    if (b.totalR) {
      p.titulo("Qué me lastiman", 3); p.barras(b.afecta, Math.max(1, ...b.afecta.map(x => x[1])));
      p.parrafo(`Temor debajo en ${b.conTemor} de ${b.totalR} resentimientos.`, { z: 9.5, tras: 8 });
      p.titulo("Mi parte", 3); p.barras(b.parte, Math.max(1, ...b.parte.map(x => x[1])));
    }
    if (b.flaq.some(x => x[1])) { p.titulo("Siete flaquezas (0 a 5)", 3); p.barras(b.flaq, 5); }
    if (b.inst.some(x => x[1])) { p.titulo("Tres instintos (0 a 5)", 3); p.barras(b.inst, 5); }
    if (b.roles.some(x => x[1])) { p.titulo("En mis relaciones", 3); p.barras(b.roles, Math.max(1, ...b.roles.map(x => x[1]))); }
    if (b.nudos.length) { p.titulo("Nudos: quienes aparecen en más de una lista", 3); b.nudos.forEach(([n, en]) => p.parrafo(`${n}: ${en.join(", ")}`, { z: 9.8, tras: 1 })); p.y -= 6; }
    if (b.palabras.length) { p.titulo("Palabras que más repito", 3); p.parrafo(b.palabras.map(([w, n]) => `${w} (${n})`).join("  ·  "), { z: 9.8 }); }
  }
  estantes.forEach((e, i) => {
    const conDatos = op.blanco || estanteTieneDatos(e);
    if (!conDatos) return;
    p.nueva();
    p.titulo(e.titulo, 1);
    if (op.citas) e.aprende.filter(b => b.c).slice(0, 2).forEach(b => p.citaP(b.c));
    if (e.nota && op.blanco) p.parrafo(e.nota, { z: 9, color: GRIS, tras: 6 });
    e.formas.forEach(f => {
      // El teléfono y las iniciales del punto de partida no van en el cuerpo del PDF.
      const g = f.id === "pacto" ? { ...f, campos: f.campos.filter(c => !["iniciales", "padrino", "telefono"].includes(c.k)) } : f;
      const hay = f.tipo === "libre" ? g.campos.some(c => valor(verObj(f.id)[c.k])) : formaTieneDatos(f);
      if (op.blanco || hay) formaEnPDF(p, g, op.blanco);
    });
  });
  const blob = p.terminar(op.blanco ? "Hojas para el Cuarto Paso" : "Personal y confidencial");
  descargar(blob, op.blanco ? "hojas_en_blanco.pdf" : `cuaderno_${hoyISO()}.pdf`);
  tostada("PDF generado. Guárdalo fuera de carpetas sincronizadas.");
}
