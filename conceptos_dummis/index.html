<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doce Conceptos en Juego</title>
<meta name="description" content="Aprende los Doce Conceptos para el Servicio Mundial de AA desde cero, con fichas sencillas, retos, estrellas y niveles, y su relación con los Doce Pasos, las Doce Tradiciones y la vida del grupo.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FF2E63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EA; --bg2:#FFFDF8; --card:#FFFFFF; --ink:#1B1035; --ink2:#4A3F66; --muted:#7D7396;
  --line:#EFE3D0; --shadow:0 10px 30px -12px rgba(60,20,90,.25);
  --pink:#FF2E63; --orange:#FF7A00; --yellow:#FFC300; --green:#22C55E; --cyan:#00B8F0;
  --blue:#3D5AFE; --violet:#8E44EC; --magenta:#F72FD0; --red:#FF4B2B; --teal:#00C9A7; --lime:#9ACD00; --indigo:#6C3BFF;
  --ok:#14B86A; --bad:#FF3B5C;
  --r:22px;
  --font-d:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-b:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140B2A; --bg2:#1C1238; --card:#231846; --ink:#FFF6E9; --ink2:#E2D8FF; --muted:#B3A6D9;
    --line:#3A2C66; --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#140B2A; --bg2:#1C1238; --card:#231846; --ink:#FFF6E9; --ink2:#E2D8FF; --muted:#B3A6D9;
  --line:#3A2C66; --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font-b); color:var(--ink); background:var(--bg);
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(600px 400px at 0% 0%, rgba(255,46,99,.14), transparent 60%),
    radial-gradient(500px 400px at 100% 10%, rgba(0,184,240,.16), transparent 60%),
    radial-gradient(600px 500px at 50% 100%, rgba(255,195,0,.16), transparent 60%),
    radial-gradient(400px 300px at 90% 70%, rgba(142,68,236,.14), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--font-d); line-height:1.15; margin:0 0 .4em}
p{margin:0 0 .8em}
button{font-family:inherit; font-size:inherit; cursor:pointer; color:inherit}
a{color:var(--blue)}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px}
.hidden{display:none!important}

/* ---------- Barra superior ---------- */
.top{position:sticky; top:0; z-index:40; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:2px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:10px; padding-top:8px; padding-bottom:8px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); margin-right:auto; min-width:0}
.brand .logo{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-family:var(--font-d); font-weight:800; color:#fff; font-size:20px;
  background:conic-gradient(var(--pink),var(--orange),var(--yellow),var(--green),var(--cyan),var(--blue),var(--violet),var(--magenta),var(--pink)); box-shadow:0 4px 14px -4px rgba(255,46,99,.6); flex:none}
.brand .logo span{background:var(--ink); color:#fff; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:16px}
.brand b{font-family:var(--font-d); font-size:20px; white-space:nowrap}
.brand small{display:block; font-size:12px; color:var(--muted); margin-top:-4px}
.pills{display:flex; gap:6px; align-items:center}
.pill{display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; font-weight:800; font-size:14px; background:var(--card); border:2px solid var(--line); white-space:nowrap}
.pill.xp{border-color:var(--yellow)}
.pill.fire{border-color:var(--orange)}
nav.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; width:100%; padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0; background:transparent; padding:7px 13px; border-radius:999px; font-weight:800; color:var(--ink2); white-space:nowrap; font-size:15px}
nav.tabs button.on{background:var(--ink); color:var(--bg)}
nav.tabs button:hover:not(.on){background:var(--card)}

main{padding:22px 0 80px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ---------- Tarjetas ---------- */
.card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:20px; border:2px solid var(--line)}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.eyebrow{font-weight:900; text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:16px; padding:12px 20px; font-weight:900; font-size:16px;
  background:var(--ink); color:var(--bg); box-shadow:0 5px 0 rgba(0,0,0,.25); transition:transform .08s, box-shadow .08s; text-decoration:none}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.pop{background:linear-gradient(135deg,var(--pink),var(--orange)); color:#fff}
.btn.go{background:linear-gradient(135deg,var(--green),var(--teal)); color:#08261a}
.btn.sky{background:linear-gradient(135deg,var(--cyan),var(--blue)); color:#fff}
.btn.ghost{background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:8px 14px; font-size:14px; border-radius:12px}

/* ---------- Hero ---------- */
.hero{position:relative; overflow:hidden; border-radius:28px; padding:26px; color:#fff;
  background:linear-gradient(120deg,#FF2E63 0%,#FF7A00 30%,#FFC300 55%,#22C55E 75%,#00B8F0 100%); box-shadow:var(--shadow)}
.hero::after{content:""; position:absolute; inset:0; background:radial-gradient(circle at 85% 20%, rgba(255,255,255,.35), transparent 40%)}
.hero > *{position:relative; z-index:1}
.hero h1{font-size:clamp(30px,6vw,52px); text-shadow:0 3px 0 rgba(0,0,0,.18); margin-bottom:6px}
.hero p{font-size:18px; font-weight:700; max-width:640px; text-shadow:0 1px 0 rgba(0,0,0,.15)}
.hero .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.hero .btn.white{background:#fff; color:#1B1035}
.rankbox{display:flex; gap:14px; align-items:center; background:rgba(255,255,255,.22); border-radius:18px; padding:12px 14px; margin-top:16px; max-width:520px}
.rankbox .ico{font-size:40px; line-height:1}
.bar{height:14px; background:rgba(0,0,0,.18); border-radius:999px; overflow:hidden}
.bar > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#fff,#FFF3A8); transition:width .6s}
.bar.dark{background:var(--line)}
.bar.dark > i{background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow))}

/* ---------- Metas ---------- */
.goals li{list-style:none; display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:2px dashed var(--line)}
.goals li:last-child{border:0}
.goals{padding:0; margin:0}
.goals .chk{width:26px; height:26px; border-radius:9px; flex:none; display:grid; place-items:center; background:var(--line); font-size:14px}
.goals .done .chk{background:var(--ok); color:#fff}
.goals .done span{text-decoration:line-through; color:var(--muted)}

/* ---------- Mapa de niveles ---------- */
.path{position:relative; display:flex; flex-direction:column; gap:10px; padding:10px 0}
.node{display:flex; align-items:center; gap:16px; width:min(100%,560px); text-align:left; border:0; background:transparent; padding:0}
.node.alt{margin-left:auto; flex-direction:row-reverse; text-align:right}
.node .disc{width:92px; height:92px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:40px; position:relative;
  box-shadow:0 8px 0 rgba(0,0,0,.18), inset 0 -6px 0 rgba(0,0,0,.12); transition:transform .15s}
.node:hover .disc{transform:scale(1.06) rotate(-3deg)}
.node .disc .lock{position:absolute; inset:0; border-radius:50%; background:rgba(30,20,60,.55); display:grid; place-items:center; font-size:30px}
.node .disc .num{position:absolute; top:-6px; right:-6px; background:var(--ink); color:var(--bg); font-family:var(--font-d); font-weight:800; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:15px}
.node .info{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:10px 14px; box-shadow:var(--shadow); flex:1; min-width:0}
.node .info .h{display:block; font-family:var(--font-d); font-weight:800; font-size:21px; line-height:1.15}
.node .info small{color:var(--muted); font-weight:700}
.stars{font-size:18px; letter-spacing:2px; color:#E7D9B8}
.stars b{color:var(--yellow); text-shadow:0 1px 0 #b98a00}
.node.locked .info{opacity:.7}
.node.current .disc{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.connector{width:6px; height:26px; margin:0 auto; border-radius:3px; background:repeating-linear-gradient(var(--muted) 0 6px, transparent 6px 12px); opacity:.5}

/* ---------- Nivel ---------- */
.lvhead{border-radius:26px; padding:22px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden}
.lvhead h1{font-size:clamp(28px,5vw,44px); text-shadow:0 3px 0 rgba(0,0,0,.18); margin:0}
.lvhead p{font-weight:700; margin:4px 0 0}
.lvhead .big{position:absolute; right:10px; bottom:-20px; font-size:120px; opacity:.25}
.lessons{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin:18px 0}
.lcard{border:0; text-align:left; border-radius:20px; padding:16px; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.18); position:relative; min-height:130px; display:flex; flex-direction:column; gap:6px; transition:transform .12s}
.lcard:hover{transform:translateY(-3px) rotate(-.5deg)}
.lcard.dark{color:#1B1035}
.lcard .rn{font-family:var(--font-d); font-weight:800; font-size:34px; line-height:1}
.lcard .h{font-family:var(--font-d); font-weight:800; font-size:19px; line-height:1.15}
.lcard .ok{position:absolute; top:10px; right:12px; background:#fff; color:var(--ok); border-radius:999px; padding:2px 10px; font-weight:900; font-size:13px}
.lcard .ico{position:absolute; right:12px; bottom:6px; font-size:40px; opacity:.85}

/* ---------- Ficha (modal) ---------- */
.modal{position:fixed; inset:0; z-index:80; background:rgba(20,10,40,.6); display:flex; justify-content:center; align-items:flex-start; overflow-y:auto; padding:16px; animation:fade .2s}
.sheet{background:var(--bg2); width:min(820px,100%); border-radius:28px; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); overflow:hidden; margin:auto 0}
.sheet .shead{padding:24px 22px 20px; color:#fff; position:relative}
.sheet .shead.dark{color:#1B1035}
.sheet .shead .rn{font-family:var(--font-d); font-size:64px; font-weight:800; line-height:.9}
.sheet .shead h2{font-size:clamp(24px,4.5vw,36px); margin:6px 0 4px}
.sheet .shead .ico{position:absolute; right:20px; top:16px; font-size:56px}
.sheet .close{position:absolute; right:14px; top:14px; width:42px; height:42px; border-radius:50%; border:0; background:rgba(255,255,255,.9); color:#1B1035; font-size:22px; font-weight:900; z-index:2}
.sheet .sbody{padding:18px 22px 26px; display:grid; gap:14px}
.block{background:var(--card); border-radius:18px; padding:16px; border:2px solid var(--line)}
.block h4{font-size:15px; text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:8px; margin-bottom:8px}
.block h4 .tag{font-family:var(--font-b); text-transform:none; letter-spacing:0; font-size:11px; font-weight:900; padding:2px 8px; border-radius:999px; background:var(--line); color:var(--ink2)}
.frase{font-family:var(--font-d); font-size:23px; font-weight:700; line-height:1.3}
.official{font-family:Georgia, 'Times New Roman', serif; font-size:17.5px; font-style:italic; border-left:6px solid var(--c,var(--violet)); padding-left:14px}
.src{display:block; font-style:normal; font-family:var(--font-b); font-size:13px; color:var(--muted); font-weight:800; margin-top:6px}
blockquote.bill{margin:0; padding:16px 18px; border-radius:16px; background:color-mix(in srgb, var(--c,var(--violet)) 14%, var(--card)); font-family:Georgia, serif; font-size:17.5px}
blockquote.bill::before{content:"“"; font-size:60px; line-height:0; vertical-align:-24px; color:var(--c,var(--violet)); font-family:var(--font-d)}
.bridge{display:grid; gap:10px}
.bridge .verb{font-family:Georgia,serif; font-style:italic; background:color-mix(in srgb, var(--cyan) 10%, var(--card)); border-radius:12px; padding:10px 12px}
.bridge .verb b{font-style:normal; font-family:var(--font-d)}
.trap{background:linear-gradient(135deg, rgba(255,75,43,.14), rgba(255,195,0,.16))}
.micro{background:linear-gradient(135deg, rgba(34,197,94,.16), rgba(0,201,167,.16))}
.garantias{counter-reset:g; display:grid; gap:8px; padding:0; margin:0}
.garantias li{list-style:none; counter-increment:g; display:flex; gap:10px; align-items:flex-start}
.garantias li::before{content:counter(g); flex:none; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-family:var(--font-d); font-weight:800; color:#fff; background:var(--indigo)}
.garantias em{display:block; font-size:15px; color:var(--ink2)}

/* ---------- Retos ---------- */
.quiz{position:fixed; inset:0; z-index:90; background:var(--bg); overflow-y:auto; animation:fade .2s}
.quiz .qtop{position:sticky; top:0; background:var(--bg); padding:12px 0 10px; z-index:2; border-bottom:2px solid var(--line)}
.quiz .qtop .wrap{display:flex; align-items:center; gap:12px}
.quiz .qtop .bar{flex:1; background:var(--line)}
.quiz .qtop .bar > i{background:linear-gradient(90deg,var(--green),var(--cyan))}
.xbtn{width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:var(--card); font-size:20px; font-weight:900; flex:none}
.lives{font-size:20px; letter-spacing:1px}
.qwrap{max-width:720px; margin:0 auto; padding:22px 16px 140px}
.qtype{display:inline-block; font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.08em; padding:4px 12px; border-radius:999px; color:#fff; margin-bottom:12px}
.qtext{font-family:var(--font-d); font-size:clamp(22px,4vw,28px); font-weight:700; line-height:1.25; margin-bottom:18px}
.opts{display:grid; gap:10px}
.opt{border:3px solid var(--line); background:var(--card); border-radius:18px; padding:14px 16px; text-align:left; font-weight:800; font-size:17px; box-shadow:0 4px 0 var(--line); transition:transform .08s, border-color .1s; display:flex; gap:12px; align-items:center}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt .k{flex:none; width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--line); font-family:var(--font-d)}
.opt.sel{border-color:var(--blue); background:color-mix(in srgb,var(--blue) 10%, var(--card))}
.opt.right{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 16%, var(--card)); box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 14%, var(--card)); box-shadow:0 4px 0 var(--bad); animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tfrow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tfrow .opt{justify-content:center; font-size:22px; font-family:var(--font-d); padding:22px}
.chipc{flex:none; min-width:46px; height:46px; padding:0 8px; border-radius:14px; display:grid; place-items:center; font-family:var(--font-d); font-weight:800; font-size:20px; color:#fff}
.chipc.dark{color:#1B1035}
.fillbox{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:16px; font-family:Georgia,serif; font-size:19px; margin-bottom:16px}
.blank{display:inline-block; min-width:140px; border-bottom:4px solid var(--orange); text-align:center; font-family:var(--font-b); font-weight:900; color:var(--orange); padding:0 6px}
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.match .col{display:grid; gap:10px; align-content:start}
.mi{border:3px solid var(--line); background:var(--card); border-radius:14px; padding:10px 12px; font-weight:800; font-size:15px; text-align:left; box-shadow:0 3px 0 var(--line); min-height:52px}
.mi.sel{border-color:var(--blue); background:color-mix(in srgb,var(--blue) 12%, var(--card))}
.mi.done{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 15%, var(--card)); opacity:.75; cursor:default}
.mi.no{border-color:var(--bad); animation:shake .35s}
.ord-target{min-height:60px; border:3px dashed var(--line); border-radius:16px; padding:10px; display:grid; gap:8px; margin-bottom:12px}
.ord-target:empty::before{content:"Toca los elementos en el orden correcto…"; color:var(--muted); font-weight:700}
.ord-item{display:flex; gap:10px; align-items:center; border:3px solid var(--line); background:var(--card); border-radius:14px; padding:10px 12px; font-weight:800; text-align:left; box-shadow:0 3px 0 var(--line)}
.ord-item .k{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--violet); color:#fff; font-family:var(--font-d); flex:none}
.ord-bank{display:grid; gap:8px}
.feedback{position:fixed; left:0; right:0; bottom:0; z-index:3; padding:16px 0 20px; transform:translateY(110%); transition:transform .25s ease; box-shadow:0 -10px 30px -10px rgba(0,0,0,.3)}
.feedback.show{transform:none}
.feedback.good{background:#D9FBE8; color:#0B3D24}
.feedback.badf{background:#FFE1E6; color:#5A0A1B}
.feedback .wrap{max-width:720px; display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
.feedback h3{font-size:24px; margin:0 0 4px}
.feedback p{margin:0; font-size:15.5px}
.feedback .fx{flex:1; min-width:220px}
.qactions{margin-top:18px; display:flex; gap:10px; justify-content:flex-end}

.result{text-align:center; padding-top:20px}
.result .big{font-size:84px; line-height:1}
.result .pct{font-family:var(--font-d); font-size:64px; font-weight:800; line-height:1; background:linear-gradient(90deg,var(--pink),var(--orange),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent}
.result .stars{font-size:48px}
.review{text-align:left; display:grid; gap:10px; margin-top:20px}
.review .card{padding:14px}

/* ---------- Puentes ---------- */
.matrix{width:100%; border-collapse:separate; border-spacing:0 8px; font-size:15px}
.matrix th{text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 10px}
.matrix td{background:var(--card); padding:10px; vertical-align:top; border-top:2px solid var(--line); border-bottom:2px solid var(--line)}
.matrix td:first-child{border-left:2px solid var(--line); border-radius:14px 0 0 14px}
.matrix td:last-child{border-right:2px solid var(--line); border-radius:0 14px 14px 0}
.tchip{display:inline-block; padding:2px 9px; border-radius:999px; font-weight:900; font-size:13px; margin:2px 3px 2px 0; color:#fff}
.tchip.p{background:var(--cyan); color:#032836}
.tchip.t{background:var(--violet)}
.tablewrap{overflow-x:auto}
.reflist{display:grid; gap:8px; padding:0; margin:0; counter-reset:r}
.reflist li{list-style:none; display:flex; gap:10px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px}
.reflist .n{flex:none; width:32px; height:32px; border-radius:10px; display:grid; place-items:center; font-family:var(--font-d); font-weight:800; color:#fff}

/* ---------- Logros ---------- */
.badge{display:flex; gap:12px; align-items:center; padding:14px; border-radius:18px; background:var(--card); border:2px solid var(--line)}
.badge .bi{font-size:36px; width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,var(--yellow),var(--orange)); flex:none}
.badge.off{filter:grayscale(1); opacity:.5}
.stat{text-align:center}
.stat b{display:block; font-family:var(--font-d); font-size:38px; line-height:1}

/* ============================================================
   MOTOR DEL JUEGO
   ============================================================ */
const PASS = 80;               // % para aprobar y desbloquear
const STAR2 = 90, STAR3 = 100; // % para ★★ y ★★★
const BOSS_N = 20, BOSS_LIVES = 3, EXCELLENCE = 90;
const KEY = "doceConceptosJuego.v1";

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const C = n => CONCEPTS.find(c => c.n === n);
const inkFor = n => DARK_INK.includes(n) ? "#1B1035" : "#fff";

/* ---------- Estado ---------- */
const fresh = () => ({xp:0, levels:{}, read:{}, micro:{}, badges:{}, streak:0, bestStreak:0, answered:0, correct:0, daily:{}, firstSeen:todayKey()});
let S = fresh();
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(fresh(), JSON.parse(raw)); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Estadísticas anónimas (no se envía nombre, progreso exportado ni IP) ---------- */
const ESTAD_URL = "";   // URL de la aplicación web de Apps Script (ver apps-script/Code.gs). Vacío = desactivado.
const FASES = ["abrio","intento","aprobo"];
const pasoDe = (nivel, fase) => nivel*3 + FASES.indexOf(fase) + 1;   // 1..24 (8 niveles × 3 fases)
const pasoGuardado = () => Math.max(0, ...LEVELS.map(L => lv(L.id).best>=PASS ? pasoDe(L.id,"aprobo") : lv(L.id).attempts ? pasoDe(L.id,"intento") : 0));
const idLocal = (alm, k) => { try{ let v=alm.getItem(k); if(!v){ v=Date.now().toString(36)+Math.random().toString(36).slice(2,10); alm.setItem(k,v); } return v; }catch(e){ return "anon"; } };
const UID = idLocal(localStorage, KEY+".uid"), SID = idLocal(sessionStorage, KEY+".sid");
let geo = {};
const geoListo = (async () => {
  if(!ESTAD_URL) return;
  try{ const g = JSON.parse(sessionStorage.getItem(KEY+".geo")); if(g){ geo = g; return; } }catch(e){}
  try{
    const d = await (await fetch("https://get.geojs.io/v1/ip/geo.json")).json();
    geo = {ciudad:d.city||"", region:d.region||"", pais:d.country||"", codigo:d.country_code||""};   // la IP se descarta aquí
    try{ sessionStorage.setItem(KEY+".geo", JSON.stringify(geo)); }catch(e){}
  }catch(e){}
})();
async function registrar(evento, datos={}){
  if(!ESTAD_URL) return;
  await geoListo;
  let origen = ""; try{ origen = document.referrer ? new URL(document.referrer).hostname : ""; }catch(e){}
  const cuerpo = {evento, uid:UID, sid:SID, paso:S.paso||0, xp:S.xp, ...geo, ...datos, origen,
    dispositivo: matchMedia("(pointer:coarse)").matches ? "móvil" : "computador", idioma: navigator.language};
  try{ fetch(ESTAD_URL, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain"}, body:JSON.stringify(cuerpo)}); }catch(e){}
}
// Registra un paso nuevo del recorrido (solo cuando el usuario avanza más allá de lo que ya tenía)
function avance(nivel, fase, extra={}){
  const n = pasoDe(nivel, fase);
  if(n <= (S.paso||0)) return false;
  S.paso = n; save();
  registrar(fase, {nivel, ...extra});
  return true;
}

function lv(id){ return S.levels[id] || {best:0, stars:0, attempts:0}; }
function starsFor(p){ return p>=STAR3?3 : p>=STAR2?2 : p>=PASS?1 : 0; }
function unlocked(id){
  if(id===0) return true;
  if(id===7) return [0,1,2,3,4,5,6].every(i => lv(i).best >= PASS);
  return lv(id-1).best >= PASS;
}
function lessonId(x){ return x; }
function lessonsRead(level){ return LEVELS[level].lessons.filter(l => S.read[l]).length; }
function allRead(level){ return lessonsRead(level) === LEVELS[level].lessons.length; }
function rank(){ let r = RANKS[0], next=null; for(let i=0;i<RANKS.length;i++){ if(S.xp>=RANKS[i].xp){ r=RANKS[i]; next=RANKS[i+1]||null; } } return {r, next}; }

function addXP(n, why){
  if(n<=0) return;
  const before = rank().r.name;
  S.xp += n; save(); renderTop();
  const after = rank().r;
  if(after.name !== before){ toast(`${after.icon} ¡Creciste! Ahora eres ${after.name}`); confetti(); }
  else if(why) toast(`+${n} XP · ${why}`);
}
function award(id){
  if(S.badges[id]) return;
  S.badges[id] = todayKey(); save();
  const b = BADGES.find(x=>x.id===id);
  if(b){ setTimeout(()=>{ toast(`${b.icon} Insignia: ${b.name}`); confetti(); }, 700); }
}
function checkBadges(){
  if(lv(0).best>=PASS) award("primer");
  if(CONCEPTS.every(c=>S.read[c.n])) award("lector");
  if(S.bestStreak>=5) award("racha5");
  if(S.bestStreak>=10) award("racha10");
  if([0,1,2,3,4,5,6].some(i=>lv(i).stars===3)) award("triple");
  if(lv(2).stars===3) award("minoria");
  if(lv(6).best>=PASS) award("tejedor");
  if(Object.keys(S.daily).length>=3) award("diario3");
  if([0,1,2,3,4,5,6].every(i=>lv(i).best>=PASS)) award("todos");
  if([0,1,2,3,4,5,6].every(i=>lv(i).stars===3) && lv(7).best>=EXCELLENCE) award("excelencia");
}

/* ---------- UI genérica ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), 2600); }

function confetti(){
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = Object.values(COLORS);
  const P = Array.from({length:160}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.4, vx:(Math.random()-.5)*4, vy:2+Math.random()*4, s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(++f<170) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

function renderTop(){
  const {r} = rank();
  $("#pXP").innerHTML = `${r.icon} <span>${S.xp} XP</span>`;
  $("#pFire").innerHTML = `🔥 <span>${S.streak}</span>`;
  $("#pFire").title = `Racha actual (mejor: ${S.bestStreak})`;
}

/* ---------- Navegación ---------- */
const VIEWS = ["mapa","nivel","fichas","puentes","glosario","logros","mas"];
function go(view, arg){
  const h = arg!==undefined ? `#${view}/${arg}` : `#${view}`;
  if(location.hash !== h) location.hash = h; else route();
}
function route(){
  const [v, a] = (location.hash.replace("#","") || "mapa").split("/");
  const view = VIEWS.includes(v) ? v : "mapa";
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === (view==="nivel"?"mapa":view)));
  const main = $("#main");
  const R = {mapa:vMapa, nivel:()=>vNivel(+a||0), fichas:vFichas, puentes:vPuentes, glosario:vGlosario, logros:vLogros, mas:vMas}[view];
  main.innerHTML = `<div class="view">${R()}</div>`;
  window.scrollTo({top:0});
}

/* ---------- Vista: Mapa ---------- */
function currentLevel(){ for(let i=0;i<LEVELS.length;i++){ if(unlocked(i) && lv(i).best<PASS) return i; } return 7; }
function starHTML(n){ return `<span class="stars" aria-label="${n} de 3 estrellas">${[1,2,3].map(i=> i<=n?"<b>★</b>":"★").join("")}</span>`; }

function goalsList(){
  const cur = currentLevel(), L = LEVELS[cur];
  const items = [];
  if(!L.boss){
    items.push({d: allRead(cur), t:`Lee las ${L.lessons.length} fichas de “${L.name}” (${lessonsRead(cur)}/${L.lessons.length})`});
    items.push({d: lv(cur).best>=PASS, t:`Aprueba los retos de “${L.name}” con ${PASS}% o más`});
  } else {
    items.push({d: lv(7).best>=PASS, t:`Supera el Reto de Excelencia con ${PASS}% o más`});
  }
  items.push({d: !!S.daily[todayKey()], t:`Haz el reto diario de hoy (5 preguntas, +20 XP extra)`});
  const {next} = rank();
  if(next) items.push({d:false, t:`Llega a ${next.icon} ${next.name}: te faltan ${next.xp - S.xp} XP`});
  const tri = [0,1,2,3,4,5,6].filter(i=>lv(i).stars===3).length;
  items.push({d: tri===7, t:`Meta de excelencia: ★★★ en los 7 niveles (${tri}/7) y ${EXCELLENCE}% en el reto final`});
  return `<ul class="goals">${items.map(i=>`<li class="${i.d?"done":""}"><span class="chk">${i.d?"✓":""}</span><span>${esc(i.t)}</span></li>`).join("")}</ul>`;
}

function vMapa(){
  const {r,next} = rank();
  const pct = next ? Math.round((S.xp - r.xp)/(next.xp - r.xp)*100) : 100;
  const cur = currentLevel();
  const nodes = LEVELS.map((L,i)=>{
    const u = unlocked(i), st = lv(i).stars;
    return `${i?'<div class="connector"></div>':''}
    <button class="node ${i%2?"alt":""} ${u?"":"locked"} ${i===cur?"current":""}" onclick="${u?`go('nivel',${i})`:`toast('🔒 Aprueba el nivel anterior con ${PASS}% para abrir este')`}" aria-label="Nivel ${i}: ${esc(L.name)}">
      <span class="disc" style="background:${L.grad}">${L.emoji}<span class="num">${i}</span>${u?"":'<span class="lock">🔒</span>'}</span>
      <span class="info"><span class="h">${esc(L.name)}</span><small>${esc(L.sub)}</small><br>${starHTML(st)} ${lv(i).best?`<small>· mejor ${lv(i).best}%</small>`:""}</span>
    </button>`;
  }).join("");
  return `
  <section class="hero">
    <div class="eyebrow" style="color:#fff;opacity:.9">Aprende jugando · desde cero</div>
    <h1>Los Doce Conceptos<br>en juego</h1>
    <p>Los principios de servicio de AA explicados en sencillo, con retos, estrellas y niveles. Sin prisa: una ficha, un reto, un paso a la vez.</p>
    <div class="rankbox"><span class="ico">${r.icon}</span><div style="flex:1">
      <b style="font-family:var(--font-d);font-size:20px">${r.name}</b> · ${S.xp} XP
      <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
      <small style="font-weight:800">${next?`Siguiente: ${next.icon} ${next.name} (${next.xp} XP)`:"¡Llegaste al Bosque!"}</small></div></div>
    <div class="row">
      <button class="btn white" onclick="go('nivel',${cur})">▶ ${lv(0).attempts? "Seguir" : "Empezar"}: ${esc(LEVELS[cur].name)}</button>
      <button class="btn ghost" onclick="startDaily()">📅 Reto diario</button>
    </div>
  </section>

function triangleSVG(){
  const rows = ["Grupos de AA","RSG de los grupos","Distritos","Asambleas de Área","Conferencia de Servicios Generales","Junta de Servicios Generales · Entidades Operativas"];
  const cols = ["#FF2E63","#FF7A00","#FFC300","#22C55E","#00B8F0","#6C3BFF"];
  const W=600, H=360, n=rows.length, h=H/n;
  let s = `<svg viewBox="0 0 ${W} ${H+10}" role="img" aria-label="Triángulo invertido de la estructura de servicio en Colombia" style="width:100%;height:auto;display:block">`;
  rows.forEach((t,i)=>{
    const y0=i*h, y1=(i+1)*h, x=(y)=> (y/H)*(W/2)*0.92;
    const a=x(y0), b=x(y1);
    s += `<polygon points="${a},${y0} ${W-a},${y0} ${W-b},${y1} ${b},${y1}" fill="${cols[i]}" stroke="#fff" stroke-width="3"/>`;
    const dark=[2,3,4].includes(i);
    s += `<text x="${W/2}" y="${y0+h/2+6}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="${i===5?14:17}" fill="${dark?"#1B1035":"#fff"}">${esc(t)}</text>`;
  });
  return s + `</svg><p class="note" style="margin:8px 0 0">Arriba, sosteniendo todo, los grupos. Fuente: “Estructura de la Conferencia - Colombia”, ${SRC_MS}, p. 3.</p>`;
}

  }</tbody></table></div><p class="note">Toca un Concepto en la sección “Puentes” para leer cada conexión completa.</p>`;
}

/* ---------- Motor de retos ---------- */
let QZ = null;
function prepQ(q){
  const x = JSON.parse(JSON.stringify(q));
  if(x.t==="mc" || x.t==="fill" || x.t==="caso"){
    const idx = shuffle(x.o.map((_,i)=>i));
    if(x.t==="caso"){ x.o = idx.map(i=>q.o[i]); }
    else { x.a = idx.indexOf(q.a); x.o = idx.map(i=>q.o[i]); }
  }
  if(x.t==="match"){ x.right = shuffle(x.p.map(p=>p[1])); x.left = shuffle(x.p.map(p=>p[0])); }
  if(x.t==="order"){ x.bank = shuffle(x.i); let tries=0; while(x.bank.join()===x.i.join() && tries++<5) x.bank=shuffle(x.i); }
  return x;
}
function startQuiz(id, daily=false){
  let list;
  if(daily){
    const pool = []; for(let i=0;i<=6;i++){ if(unlocked(i)) pool.push(...Q[i]); }
    list = shuffle(pool).slice(0,5);
  } else if(LEVELS[id].boss){
    const pool = []; for(let i=0;i<=6;i++) pool.push(...Q[i]);
    list = shuffle(Q[7]).slice(0,6).concat(shuffle(pool).slice(0, BOSS_N-6));
    list = shuffle(list);
  } else list = shuffle(Q[id]);
  QZ = {id, daily, boss:!daily && !!LEVELS[id].boss, list:list.map(prepQ), i:0, ok:0, wrong:[], lives:BOSS_LIVES, xp:0, answered:false};
  const el = document.createElement("div"); el.className="quiz"; el.id="quiz";
  document.body.appendChild(el); document.body.style.overflow="hidden";
  renderQ();
}
function quitQuiz(){ if(QZ && QZ.i<QZ.list.length && !confirmQuit()) return; endQuizUI(); }
function confirmQuit(){ const b=$("#quitask"); if(b){ return true; } const f=$("#qfoot"); if(f){ f.insertAdjacentHTML("beforeend", `<div id="quitask" class="card" style="margin-top:12px"><b>¿Salir del reto?</b> Perderás el avance de este intento. <button class="btn sm" onclick="endQuizUI()">Sí, salir</button> <button class="btn ghost sm" onclick="this.parentNode.remove()">Seguir jugando</button></div>`); } return false; }
function endQuizUI(){ const q=$("#quiz"); if(q) q.remove(); document.body.style.overflow=""; QZ=null; route(); }

const TYPE = {mc:["Elige la correcta","#3D5AFE"], tf:["¿Verdadero o falso?","#FF7A00"], caso:["¿Qué Concepto es?","#FF2E63"], fill:["Completa el texto oficial","#8E44EC"], match:["Empareja","#00C9A7"], order:["Ordena","#F72FD0"]};

function renderQ(){
  const z = QZ, q = z.list[z.i], el = $("#quiz");
  const total = z.list.length;
  const [tn, tc] = TYPE[q.t];
  z.answered = false; z.sel = null; z.mErr = 0; z.mDone = 0; z.ord = [];
  let body = "";
  if(q.t==="mc"){
    body = `<div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if(q.t==="tf"){
    body = `<div class="qtext">${esc(q.q)}</div><div class="tfrow"><button class="opt" data-i="1" onclick="pick(1)">👍 Verdadero</button><button class="opt" data-i="0" onclick="pick(0)">👎 Falso</button></div>`;
  } else if(q.t==="caso"){
    body = `<div class="qtext">${esc(q.q)}</div><p class="note" style="margin-top:-8px">¿Qué Concepto ilumina mejor esta situación?</p><div class="opts">${q.o.map((n,i)=>`<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="chipc ${DARK_INK.includes(n)?"dark":""}" style="background:${COLORS[n]}">${n}</span><span>${esc(C(n).title)}</span></button>`).join("")}</div>`;
  } else if(q.t==="fill"){
    body = `<div class="qtext">Completa la forma corta</div><div class="fillbox">“${esc(q.pre)} <span class="blank" id="blank">______</span> ${esc(q.post)}”</div><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if(q.t==="match"){
    body = `<div class="qtext">${esc(q.q)}</div><p class="note" style="margin-top:-8px">Toca un elemento de la izquierda y luego su pareja de la derecha.</p>
      <div class="match"><div class="col">${q.left.map((l,i)=>`<button class="mi" data-side="L" data-i="${i}" onclick="mPick('L',${i})">${esc(l)}</button>`).join("")}</div>
      <div class="col">${q.right.map((r,i)=>`<button class="mi" data-side="R" data-i="${i}" onclick="mPick('R',${i})">${esc(r)}</button>`).join("")}</div></div>`;
  } else if(q.t==="order"){
    body = `<div class="qtext">${esc(q.q)}</div><div class="ord-target" id="otar"></div><div class="ord-bank" id="obank">${q.bank.map((b,i)=>`<button class="ord-item" data-i="${i}" onclick="oPick(${i})"><span class="k">·</span>${esc(b)}</button>`).join("")}</div>
      <div class="qactions"><button class="btn ghost sm" onclick="oReset()">↺ Reiniciar</button><button class="btn sky" id="ocheck" disabled onclick="oCheck()">Comprobar</button></div>`;
  }
  el.innerHTML = `
  <div class="qtop"><div class="wrap">
    <button class="xbtn" onclick="quitQuiz()" aria-label="Salir">×</button>
    <div class="bar"><i style="width:${Math.round(z.i/total*100)}%"></i></div>
    <span class="pill">${z.i+1}/${total}</span>
    ${z.boss?`<span class="lives" aria-label="${z.lives} vidas">${"❤️".repeat(z.lives)}${"🤍".repeat(BOSS_LIVES-z.lives)}</span>`:`<span class="pill fire">🔥 ${S.streak}</span>`}
  </div></div>
  <div class="qwrap" id="qfoot">
    <span class="qtype" style="background:${tc}">${tn}</span>
    ${z.daily?'<span class="qtype" style="background:#22C55E">Reto diario</span>':""}
    ${z.boss?'<span class="qtype" style="background:#FFC300;color:#1B1035">Reto de Excelencia</span>':""}
    ${body}
  </div>
  <div class="feedback" id="fb" aria-live="polite"></div>`;
}

function pick(i){
  const z=QZ, q=z.list[z.i]; if(z.answered) return;
  let right;
  if(q.t==="tf") right = (i===1) === q.a;
  else if(q.t==="caso") right = q.o[i] === q.a;
  else right = i === q.a;
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const bi = +b.dataset.i;
    let isAns;
    if(q.t==="tf") isAns = (bi===1)===q.a;
    else if(q.t==="caso") isAns = q.o[bi]===q.a;
    else isAns = bi===q.a;
    if(isAns) b.classList.add("right");
    if(bi===i && !right) b.classList.add("wrong");
  });
  if(q.t==="fill"){ const bl=$("#blank"); bl.textContent = q.o[q.a]; }
  answer(right);
}
function mPick(side, i){
  const z=QZ, q=z.list[z.i]; if(z.answered) return;
  const btn = document.querySelector(`.mi[data-side="${side}"][data-i="${i}"]`);
  if(btn.classList.contains("done")) return;
  if(side==="L"){ document.querySelectorAll('.mi[data-side="L"]').forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); z.sel=i; return; }
  if(z.sel===null){ toast("Primero toca un elemento de la izquierda"); return; }
  const left = q.left[z.sel], rightTxt = q.right[i];
  const pair = q.p.find(p=>p[0]===left);
  const lb = document.querySelector(`.mi[data-side="L"][data-i="${z.sel}"]`);
  if(pair && pair[1]===rightTxt){
    lb.classList.remove("sel"); lb.classList.add("done"); btn.classList.add("done"); z.sel=null; z.mDone++;
    if(z.mDone===q.p.length) answer(z.mErr===0);
  } else {
    z.mErr++; btn.classList.add("no"); setTimeout(()=>btn.classList.remove("no"),400);
  }
}
function oPick(i){
  const z=QZ, q=z.list[z.i]; if(z.answered) return;
  if(z.ord.includes(i)) return;
  z.ord.push(i); oDraw();
}
function oUndo(k){ const z=QZ; if(z.answered) return; z.ord.splice(k,1); oDraw(); }
function oReset(){ if(QZ.answered) return; QZ.ord=[]; oDraw(); }
function oDraw(){
  const z=QZ, q=z.list[z.i];
  $("#otar").innerHTML = z.ord.map((bi,k)=>`<button class="ord-item" onclick="oUndo(${k})"><span class="k">${k+1}</span>${esc(q.bank[bi])}</button>`).join("");
  document.querySelectorAll("#obank .ord-item").forEach(b=>{ b.classList.toggle("hidden", z.ord.includes(+b.dataset.i)); });
  $("#ocheck").disabled = z.ord.length !== q.bank.length;
}
function oCheck(){
  const z=QZ, q=z.list[z.i];
  const seq = z.ord.map(bi=>q.bank[bi]);
  const right = seq.join("|")===q.i.join("|");
  $("#otar").querySelectorAll(".ord-item").forEach((b,k)=>{ b.disabled=true; b.style.borderColor = seq[k]===q.i[k] ? "var(--ok)" : "var(--bad)"; });
  $("#ocheck").disabled = true;
  answer(right);
}

function answer(right){
  const z=QZ, q=z.list[z.i]; z.answered = true;
  S.answered++;
  let gained = 0;
  if(right){
    z.ok++; S.correct++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    gained = 10 + Math.min(Math.max(S.streak-1,0),5)*2;
    z.xp += gained;
  } else {
    S.streak = 0; z.wrong.push(q);
    if(z.boss) z.lives--;
  }
  save(); renderTop(); checkBadges();
  const fb = $("#fb");
  const solution = right ? "" : solutionText(q);
  const out = z.boss && z.lives<=0;
  fb.className = "feedback show " + (right?"good":"badf");
  fb.innerHTML = `<div class="wrap"><div class="fx">
      <h3>${right? pickOne(["¡Excelente!","¡Así es!","¡Bien hecho!","¡Lo tienes!","¡Correcto!"]) + ` +${gained} XP` : pickOne(["Casi…","No exactamente","Esta no era","Revisemos"])}</h3>
      ${solution?`<p><b>Respuesta:</b> ${esc(solution)}</p>`:""}
      <p>${esc(q.e)}</p>
    </div>
    <button class="btn ${right?"go":"pop"}" id="nextb" onclick="nextQ()">${out?"Ver resultado":(z.i+1<z.list.length?"Siguiente →":"Ver resultado")}</button></div>`;
  setTimeout(()=>{ const n=$("#nextb"); if(n) n.focus(); }, 50);
}
function solutionText(q){
  if(q.t==="mc"||q.t==="fill") return q.o[q.a];
  if(q.t==="tf") return q.a ? "Verdadero" : "Falso";
  if(q.t==="caso") return `Concepto ${q.a}: ${C(q.a).title}`;
  if(q.t==="order") return q.i.join(" → ");
  if(q.t==="match") return q.p.map(p=>p[0]+" = "+p[1]).join(" · ");
  return "";
}
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
function nextQ(){
  const z=QZ;
  if(z.boss && z.lives<=0) return finish();
  z.i++;
  if(z.i>=z.list.length) return finish();
  renderQ();
}

function finish(){
  const z=QZ, total=z.list.length, pct=Math.round(z.ok/total*100);
  const id=z.id, el=$("#quiz");
  let xpGain = z.xp, msg="", stars=0, firstPass=false;
  if(z.daily){
    const already = !!S.daily[todayKey()];
    if(!already){ S.daily[todayKey()] = pct; xpGain += 20; }
    else xpGain = Math.round(xpGain/2);
    msg = already ? "Ya habías hecho el reto de hoy: esta vez cuenta la mitad de XP." : "¡Reto diario cumplido! +20 XP de bonificación.";
  } else {
    const prev = lv(id);
    const wasPassed = prev.best >= PASS;
    const first = prev.attempts===0;
    if(!first) xpGain = Math.round(xpGain/2);
    stars = starsFor(pct);
    const best = Math.max(prev.best, pct);
    S.levels[id] = {best, stars:starsFor(best), attempts:prev.attempts+1, last:pct};
    firstPass = !wasPassed && pct>=PASS;
    if(firstPass) xpGain += 50;
    if(z.boss && z.lives<=0) msg = "Se acabaron las vidas. Repasa las fichas y vuelve: cada intento te hace más fuerte.";
    else if(pct===100) msg = "¡Perfecto! Tres estrellas: eso es excelencia.";
    else if(pct>=PASS) msg = firstPass && id<7 ? `¡Aprobado! Se abrió el nivel ${id+1}: “${LEVELS[id+1].name}”. +50 XP` : "¡Aprobado! Repite para conseguir más estrellas.";
    else msg = `Te faltó poco. Necesitas ${PASS}%: repasa las fichas y vuelve a intentarlo.`;
  }
  const rb = rank().r.name; S.xp += xpGain; save(); renderTop(); checkBadges();
  if(!z.daily){ avance(id, "intento"); if(pct>=PASS) avance(id, "aprobo"); }
  registrar("reto", {nivel: z.daily ? "diario" : id, puntaje:pct, estrellas:stars, errores:z.wrong.length});
  if(rank().r.name!==rb) setTimeout(()=>toast(`${rank().r.icon} ¡Creciste! Ahora eres ${rank().r.name}`), 900);
  if(pct>=PASS) confetti();
  const L = LEVELS[id];
  el.innerHTML = `<div class="qwrap result">
    <div class="big">${pct===100?"🏆":pct>=PASS?"🎉":"💪"}</div>
    <div class="pct">${pct}%</div>
    <p style="font-weight:800">${z.ok} de ${total} correctas · +${xpGain} XP</p>
    ${z.daily?"":starHTML(stars)}
    <p style="font-family:var(--font-d);font-size:22px;margin-top:10px">${esc(msg)}</p>
    <div class="qactions" style="justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" onclick="endQuizUI()">Volver</button>
      ${z.daily?"":`<button class="btn pop" onclick="document.getElementById('quiz').remove();startQuiz(${id})">↺ Repetir</button>`}
      ${!z.daily && pct>=PASS && id<7 ? `<button class="btn go" onclick="document.getElementById('quiz').remove();document.body.style.overflow='';QZ=null;go('nivel',${id+1})">Siguiente nivel →</button>`:""}
    </div>
    ${z.wrong.length?`<div class="review"><h3 style="text-align:center">Para repasar</h3>${z.wrong.map(q=>`<div class="card"><b>${esc(q.q||("Completa: “"+q.pre+" ___ "+q.post+"”"))}</b><p style="margin:6px 0 0"><b>Respuesta:</b> ${esc(solutionText(q))}</p><p class="note" style="margin:4px 0 0">${esc(q.e)}</p></div>`).join("")}</div>`:""}
  </div>`;
  el.scrollTop = 0;
}
function startDaily(){ startQuiz(0, true); }

function exportP(){
  const blob = new Blob([JSON.stringify({app:"doce-conceptos-en-juego", v:1, exported:new Date().toISOString(), state:S}, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "progreso-doce-conceptos.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importP(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.state) throw 0; S = Object.assign(fresh(), d.state); save(); renderTop(); toast("✅ Progreso importado"); route(); }catch(e){ toast("⚠️ Ese archivo no es un progreso válido"); } };
  r.readAsText(f);
}
function resetAsk(btn){
  btn.outerHTML = `<span class="card" style="padding:8px 12px">¿Seguro? Se borra todo. <button class="btn sm pop" onclick="S=fresh();save();renderTop();toast('Progreso reiniciado');go('mapa')">Sí, borrar</button></span>`;
}
function setTheme(t){
  try{ if(t) localStorage.setItem(KEY+".theme", t); else localStorage.removeItem(KEY+".theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
}

  route();
})();
